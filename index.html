<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACG5026 Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F1E7BE;
  --paper-line: rgba(84, 111, 158, 0.24);
  --paper-margin: rgba(154, 43, 59, 0.38);
  --card: #FEFBF1;
  --card-border: rgba(27, 35, 64, 0.13);
  --ink: #1B2340;
  --ink-soft: #4B5478;
  --ink-faint: #85899e;
  --red: #9C2B3B;
  --red-deep: #711D29;
  --green: #2C6B4A;
  --green-bg: #E3EEE5;
  --red-bg: #F5E4E2;
  --gold: #AD8A3F;
  --gold-soft: #D8C48C;
  --shadow-sm: 0 1px 0 rgba(27,35,64,0.05), 0 2px 6px rgba(27,35,64,0.06);
  --shadow-md: 0 1px 0 rgba(27,35,64,0.06), 0 14px 34px -10px rgba(27,35,64,0.22);
  --radius: 5px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
  background-image:
    radial-gradient(rgba(27,35,64,0.05) 0.6px, transparent 0.6px),
    repeating-linear-gradient(to bottom, transparent 0, transparent 33px, var(--paper-line) 33px, var(--paper-line) 34px);
  background-size: 5px 5px, 100% 34px;
  background-position: 0 0, 0 84px;
  min-height: 100vh;
}
h1, h2, h3 { font-family: 'Spectral', Georgia, serif; margin: 0; }
p { margin: 0; }
button { font-family: inherit; }
input, select { font-family: inherit; }
::selection { background: var(--gold-soft); color: var(--ink); }

.page {
  position: relative; max-width: 800px; margin: 0 auto;
  padding: 0 30px 90px 58px;
  border-left: 2px solid var(--paper-margin);
  min-height: 100vh;
}
@media (max-width: 640px) { .page { padding: 0 14px 60px 22px; border-left-width: 1.5px; } }

.site-header { padding: 40px 0 0; }
.brand { display: flex; align-items: flex-start; gap: 16px; }
.brand-mark {
  flex: none; width: 46px; height: 46px; border-radius: 50%;
  border: 1.5px solid var(--gold); display: flex; align-items: center; justify-content: center;
  font-family: 'Spectral', serif; font-size: 21px; font-weight: 600;
  color: var(--red); background: var(--card); box-shadow: var(--shadow-sm);
  transform: rotate(-4deg);
}
.brand-text h1 { font-size: 27px; font-weight: 600; letter-spacing: -0.012em; }
.brand-text p { margin-top: 6px; font-size: 14.5px; color: var(--ink-soft); max-width: 44ch; }
.brand-text p.brand-by {
  margin-top: 9px; font-family: 'Spectral', serif; font-weight: 600;
  font-size: 15.5px; color: var(--red); letter-spacing: 0.005em;
}
.header-rule {
  height: 1.5px; margin: 24px 0 30px;
  background: linear-gradient(var(--gold), var(--gold)) bottom / 100% 1.5px no-repeat;
  opacity: 0.75;
}
.screen { padding-top: 2px; }
.screen[hidden] { display: none; }
.screen-enter { animation: fadeUp .38s cubic-bezier(.2,.8,.3,1); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.intro-card {
  position: relative; background: var(--card); border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 22px 24px 22px 26px;
  box-shadow: var(--shadow-md); margin-bottom: 32px;
}
.intro-card::before {
  content: ""; position: absolute; left: -2px; top: 18px; bottom: 18px;
  width: 3px; background: var(--red); border-radius: 2px;
}
.intro-kicker {
  font-family: 'Spectral', serif; font-weight: 600; font-style: italic;
  color: var(--red); font-size: 15px; margin-bottom: 9px;
}
.intro-text { font-size: 15.5px; line-height: 1.6; }

.section-label {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--gold); font-weight: 700; margin: 30px 0 12px;
}
.section-label:first-of-type { margin-top: 0; }

.mode-list { display: flex; flex-direction: column; gap: 10px; }
.mode-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 14px; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
  padding: 15px 17px; cursor: pointer; box-shadow: var(--shadow-sm);
  transition: border-color .15s ease, box-shadow .15s ease, transform .12s ease;
}
.mode-row:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.mode-row:disabled { cursor: not-allowed; opacity: 0.5; }
.mode-num {
  flex: none; width: 27px; height: 27px; border-radius: 50%;
  border: 1.5px solid var(--ink-soft); display: flex; align-items: center; justify-content: center;
  font-size: 12.5px; font-weight: 700; color: var(--ink-soft);
}
.mode-info { flex: 1; }
.mode-name { font-family: 'Spectral', serif; font-size: 17px; font-weight: 600; }
.mode-meta { font-size: 12.5px; color: var(--ink-faint); margin-top: 3px; }
.mode-tag {
  flex: none; margin-left: auto; white-space: nowrap; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em;
  font-weight: 700; color: var(--ink-faint); border: 1px solid var(--card-border);
  padding: 3px 7px; border-radius: 3px;
}
.mode-tag.hard { color: var(--red); border-color: rgba(156,43,59,0.35); }

.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; flex-wrap: wrap; gap: 8px; }
.topbar-label { font-size: 13.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.link-btn {
  background: none; border: none; color: var(--ink-soft); text-decoration: underline;
  text-decoration-color: var(--gold-soft); text-underline-offset: 3px; cursor: pointer;
  padding: 2px 0; font-size: 13.5px;
  transition: color .12s ease, text-decoration-color .12s ease;
}
.link-btn:hover { color: var(--red); text-decoration-color: var(--red); }
.link-btn.subtle { font-size: 14px; text-decoration: none; }
.link-btn.subtle:hover { text-decoration: underline; text-decoration-color: var(--gold-soft); }

.progress-track { height: 6px; background: rgba(27,35,64,0.08); border-radius: 3px; overflow: hidden; margin-bottom: 28px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); width: 0%; transition: width .3s cubic-bezier(.3,.7,.4,1); }

.exam-card {
  background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
  padding: 28px 28px 24px; box-shadow: var(--shadow-md);
}
.exam-category { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); font-weight: 700; margin-bottom: 12px; }
.exam-question { font-size: 19.5px; line-height: 1.48; font-weight: 500; margin-bottom: 22px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice-btn {
  display: flex; align-items: flex-start; gap: 13px; text-align: left; width: 100%;
  background: #FFFFFF; border: 1.5px solid var(--card-border); border-radius: var(--radius);
  padding: 14px 16px; font-size: 15px; line-height: 1.42; color: var(--ink); cursor: pointer;
  transition: border-color .14s ease, background .14s ease, transform .1s ease;
}
.choice-btn:hover:not(:disabled) { border-color: var(--gold); background: #FFFBEE; transform: translateX(2px); }
.choice-letter {
  flex: none; width: 25px; height: 25px; border-radius: 50%; border: 1.5px solid var(--ink-soft);
  display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; color: var(--ink-soft);
  transition: border-color .14s ease, color .14s ease, background .14s ease;
}
.choice-btn:disabled { cursor: default; }
.choice-btn:disabled:hover { transform: none; }
.choice-btn.correct { border-color: var(--green); background: var(--green-bg); }
.choice-btn.correct .choice-letter { border-color: var(--green); color: var(--green); background: #fff; }
.choice-btn.incorrect { border-color: var(--red); background: var(--red-bg); }
.choice-btn.incorrect .choice-letter { border-color: var(--red); color: var(--red); background: #fff; }
.choice-btn.dim { opacity: 0.5; }

.feedback { margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--card-border); animation: fadeUp .3s ease; }
.feedback-verdict { font-family: 'Spectral', serif; font-weight: 700; font-size: 16px; margin-bottom: 7px; }
.feedback-verdict.right { color: var(--green); }
.feedback-verdict.wrong { color: var(--red); }
.feedback-explain { font-size: 14.5px; line-height: 1.58; color: var(--ink-soft); }

.nav-row { display: flex; justify-content: flex-end; margin-top: 20px; gap: 12px; align-items: center; }
.next-btn {
  background: var(--ink); color: #FEFBF1; border: none; border-radius: 4px;
  padding: 13px 26px; font-size: 15px; font-weight: 600; cursor: pointer;
  transition: background .14s ease, transform .1s ease;
}
.next-btn:hover { background: var(--red-deep); }
.next-btn:active { transform: scale(0.98); }

.stamp-btn {
  position: relative; background: transparent; border: 3px solid var(--red); color: var(--red);
  font-family: 'Spectral', serif; font-weight: 700; font-size: 17px; letter-spacing: 0.03em;
  padding: 13px 28px; border-radius: 4px; cursor: pointer; transform: rotate(-1.4deg);
  transition: transform .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
}
.stamp-btn:hover:not(:disabled) { background: var(--red); color: #FEFBF1; transform: rotate(-1.4deg) scale(1.03); box-shadow: 0 10px 22px -8px rgba(156,43,59,0.55); }
.stamp-btn:active:not(:disabled) { transform: rotate(-1.4deg) scale(0.99); }
.stamp-btn:disabled { opacity: 0.35; cursor: not-allowed; border-color: var(--ink-faint); color: var(--ink-faint); transform: rotate(0); }
.start-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 6px; }

/* fill in the blank */
.fib-q { font-size: 18.5px; line-height: 1.95; font-weight: 500; }
.blank-input {
  display: inline-block; min-width: 150px; width: auto;
  border: none; border-bottom: 2px solid var(--ink-soft); background: transparent;
  font-size: 17px; font-weight: 600; color: var(--red-deep); padding: 1px 5px 2px;
  text-align: center;
  transition: border-color .14s ease, background .14s ease;
}
.blank-input:focus { outline: none; border-bottom-color: var(--red); background: #FFFBEE; }
.blank-input.right { border-bottom-color: var(--green); color: var(--green); }
.blank-input.wrong { border-bottom-color: var(--red); color: var(--red); text-decoration: line-through; text-decoration-thickness: 1px; }
.answer-key { font-size: 14.5px; color: var(--green); font-weight: 600; margin-top: 14px; }

/* drills: tables */
.drill-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.drill-table th {
  text-align: left; font-family: 'Inter', sans-serif; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--gold); font-weight: 700;
  padding: 0 8px 9px; border-bottom: 1.5px solid var(--gold-soft);
}
.drill-table td { padding: 9px 8px; border-bottom: 1px solid var(--card-border); vertical-align: middle; line-height: 1.45; }
.drill-table tr:last-child td { border-bottom: none; }
.drill-select {
  width: 100%; max-width: 260px; padding: 7px 8px; font-size: 14px; color: var(--ink);
  background: #FFFFFF; border: 1.5px solid var(--card-border); border-radius: 4px; cursor: pointer;
  transition: border-color .14s ease, background .14s ease;
}
.drill-select.narrow { max-width: 132px; }
.drill-select:hover { border-color: var(--gold); }
.drill-select:focus { outline: none; border-color: var(--red); }
.drill-select.right { border-color: var(--green); background: var(--green-bg); }
.drill-select.wrong { border-color: var(--red); background: var(--red-bg); }
.row-note { font-size: 13px; color: var(--green); font-weight: 600; margin-top: 4px; }
.row-note.wrong { color: var(--red); }

/* statement builder */
.stmt-prompt {
  background: var(--card); border: 1px solid var(--card-border); border-left: 4px solid var(--gold);
  border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow-sm); margin-bottom: 24px;
}
.stmt-prompt h3 { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
.stmt-prompt ul { margin: 0; padding-left: 20px; font-size: 14.5px; line-height: 1.75; color: var(--ink); }
.stmt-prompt .ask { margin-top: 13px; font-size: 14px; color: var(--ink-soft); line-height: 1.55; }

.stmt-head {
  text-align: center; font-family: 'Spectral', serif; font-weight: 700; font-size: 16px;
  line-height: 1.4; padding: 14px 10px 16px; border-bottom: 1.5px solid var(--ink);
}
.stmt-head span { display: block; font-weight: 600; font-size: 14.5px; color: var(--ink-soft); }
.stmt-table { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.stmt-table td { padding: 6px 4px; }
.stmt-table td.amt { width: 150px; text-align: right; }
.stmt-table tr.head-row td { font-weight: 700; padding-top: 15px; font-family: 'Spectral', serif; font-size: 15.5px; }
.stmt-table tr.indent td.lbl { padding-left: 22px; }
.stmt-table tr.total td { border-top: 1px solid var(--ink); font-weight: 600; }
.stmt-table tr.grand td { border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); font-weight: 700; }
.amt-input {
  width: 130px; text-align: right; padding: 6px 8px; font-size: 14.5px; font-variant-numeric: tabular-nums;
  background: #FFFFFF; border: 1.5px solid var(--card-border); border-radius: 4px; color: var(--ink);
  transition: border-color .14s ease, background .14s ease;
}
.amt-input:focus { outline: none; border-color: var(--red); background: #FFFBEE; }
.amt-input.right { border-color: var(--green); background: var(--green-bg); color: var(--green); font-weight: 600; }
.amt-input.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); font-weight: 600; }
.lbl-select { width: 100%; max-width: 300px; padding: 6px 8px; font-size: 14px; background: #FFFFFF; border: 1.5px solid var(--card-border); border-radius: 4px; cursor: pointer; }
.lbl-select:focus { outline: none; border-color: var(--red); }
.lbl-select.right { border-color: var(--green); background: var(--green-bg); }
.lbl-select.wrong { border-color: var(--red); background: var(--red-bg); }
.lbl-input { width: 100%; max-width: 300px; padding: 6px 8px; font-size: 14px; background: #FFFFFF; border: 1.5px solid var(--card-border); border-radius: 4px; color: var(--ink); }
.lbl-input:focus { outline: none; border-color: var(--red); background: #FFFBEE; }
.lbl-input.right { border-color: var(--green); background: var(--green-bg); }
.lbl-input.wrong { border-color: var(--red); background: var(--red-bg); }
.calc-cell { font-weight: 700; padding-right: 9px; }
.calc-cell.tie { color: var(--green); }
.calc-cell.notie { color: var(--red); }
.tie-note { font-size: 13.5px; margin-top: 14px; line-height: 1.5; }
.tie-note.ok { color: var(--green); font-weight: 600; }
.tie-note.bad { color: var(--red); font-weight: 600; }


/* journal entries */
.je-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.je-table th {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--gold);
  font-weight: 700; padding: 0 6px 9px; border-bottom: 1.5px solid var(--gold-soft); text-align: left;
}
.je-table th.num { text-align: right; }
.je-table td { padding: 4px 6px; vertical-align: middle; }
.je-table tr.memo-row td { padding: 2px 6px 11px; border-bottom: 1px solid var(--card-border); }
.je-table tr.memo-row:last-child td { border-bottom: none; }
.je-ref { width: 40px; font-weight: 700; color: var(--ink-soft); vertical-align: top; padding-top: 11px; }
.je-acct { min-width: 150px; }
.je-num { width: 104px; text-align: right; }
.je-table tr.cr-line td.je-acct { padding-left: 24px; }
.je-memo { font-size: 12.5px; color: var(--ink-faint); font-style: italic; }
.je-input {
  width: 96px; text-align: right; padding: 5px 7px; font-size: 13.5px; font-variant-numeric: tabular-nums;
  background: #FFFFFF; border: 1.5px solid var(--card-border); border-radius: 4px; color: var(--ink);
  transition: border-color .14s ease, background .14s ease;
}
.je-input:focus { outline: none; border-color: var(--red); background: #FFFBEE; }
.je-input.right { border-color: var(--green); background: var(--green-bg); color: var(--green); font-weight: 600; }
.je-input.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); font-weight: 600; }
.je-acct-field { width: 100%; padding: 5px 7px; font-size: 13.5px; background: #FFFFFF; border: 1.5px solid var(--card-border); border-radius: 4px; color: var(--ink); }
.je-acct-field:focus { outline: none; border-color: var(--red); background: #FFFBEE; }
.je-acct-field.right { border-color: var(--green); background: var(--green-bg); }
.je-acct-field.wrong { border-color: var(--red); background: var(--red-bg); }
.je-totals { display: flex; justify-content: flex-end; gap: 26px; margin-top: 16px; padding-top: 14px; border-top: 1.5px solid var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
.je-totals span { font-weight: 700; }
.txn-list { margin: 0; padding-left: 22px; font-size: 14.5px; line-height: 1.85; }
.txn-list li { padding-left: 2px; }
@media (max-width: 640px) {
  .je-table { font-size: 13px; }
  .je-num { width: 78px; }
  .je-input { width: 72px; font-size: 12.5px; padding: 4px 5px; }
  .je-acct-field { font-size: 12.5px; }
  .je-ref { width: 26px; }
  .je-table td { padding: 3px 3px; }
  .je-table tr.cr-line td.je-acct { padding-left: 12px; }
}


/* scrollable question list */
.q-card { padding: 19px 22px 17px; margin-bottom: 13px; }
.q-card .exam-question { font-size: 17px; line-height: 1.45; margin-bottom: 15px; }
.q-card .fib-q { font-size: 16.5px; line-height: 1.95; }
.q-card .choices { gap: 8px; }
.q-card .choice-btn { padding: 11px 14px; font-size: 14.5px; }
.q-num {
  font-family: 'Spectral', serif; font-weight: 700; font-size: 13px; color: var(--gold);
  letter-spacing: 0.06em; margin-bottom: 9px;
}
.check-sm {
  background: var(--ink); color: #FEFBF1; border: none; border-radius: 4px;
  padding: 8px 17px; font-size: 13.5px; font-weight: 600; cursor: pointer; margin-top: 15px;
  transition: background .14s ease;
}
.check-sm:hover { background: var(--red-deep); }
.q-card .feedback { margin-top: 16px; padding-top: 14px; }
.quiz-scorebar {
  position: sticky; top: 0; z-index: 5; background: var(--paper);
  padding: 9px 0 10px; margin-bottom: 14px;
  border-bottom: 1px solid var(--card-border);
  font-size: 13.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums;
}

.step-label {
  font-family: 'Spectral', serif; font-weight: 700; font-size: 15px; color: var(--red);
  margin: 0 0 11px; letter-spacing: 0.01em;
}
.step-label span { color: var(--ink-faint); font-weight: 400; font-size: 13.5px; font-family: 'Inter', sans-serif; }
.score-split { font-size: 13.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; line-height: 1.6; }
.score-split strong { color: var(--ink); }

/* equations quiz */
.eq-block { padding: 16px 0 15px; border-bottom: 1px solid var(--card-border); }
.eq-block:last-of-type { border-bottom: none; }
.eq-name { font-family: 'Spectral', serif; font-weight: 700; font-size: 16px; margin-bottom: 11px; }
.eq-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.eq-op { font-family: 'Spectral', serif; font-weight: 700; font-size: 19px; color: var(--red); padding: 0 1px; }
.eq-select {
  min-width: 168px; padding: 8px 9px; font-size: 14.5px; color: var(--ink);
  background: #FFFFFF; border: 1.5px solid var(--card-border); border-radius: 4px; cursor: pointer;
  transition: border-color .14s ease, background .14s ease;
}
.eq-select:hover { border-color: var(--gold); }
.eq-select:focus { outline: none; border-color: var(--red); }
.eq-select.right { border-color: var(--green); background: var(--green-bg); }
.eq-select.wrong { border-color: var(--red); background: var(--red-bg); }
@media (max-width: 640px) { .eq-select { min-width: 0; flex: 1 1 128px; font-size: 13.5px; } }

/* results */
.results-card {
  background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
  padding: 34px 26px 30px; box-shadow: var(--shadow-md); margin-bottom: 28px; text-align: center;
}
.score-ring-wrap { position: relative; width: 172px; height: 172px; margin: 0 auto 18px; }
.score-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.score-ring-track { fill: none; stroke: rgba(27,35,64,0.09); stroke-width: 10; }
.score-ring-fill {
  fill: none; stroke: var(--red); stroke-width: 10; stroke-linecap: round;
  stroke-dasharray: 471; stroke-dashoffset: 471;
  transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1), stroke 1s ease;
}
.score-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

<script>
const BANK = {};

BANK.ch1mc = [
{q:"Accounting is best defined as the process of:",o:["Preparing tax returns for individuals and businesses","Recording, summarizing, and analyzing financial transactions to help people make economic decisions","Auditing financial statements for accuracy","Forecasting future stock prices"],c:1,e:"Accounting is a process with three parts (record, summarize, analyze) and one purpose: helping people make economic decisions. Tax preparation and auditing are things accountants do, but they are not the definition of accounting itself."},
{q:"Financial accounting is designed primarily for:",o:["Decision makers inside the company","Decision makers outside the company","Internal auditors","Production supervisors"],c:1,e:"Financial accounting serves external users: investors, creditors, suppliers, and customers. Managerial accounting is the one aimed at people inside the company."},
{q:"Which of the following is a characteristic of managerial accounting?",o:["Must conform to GAAP","Historic in nature","Future oriented and highly detailed","General purpose reports for external users"],c:2,e:"Managerial accounting is built for planning and decisions that have not happened yet, so it is forward looking and as detailed as managers need. The other three options all describe financial accounting."},
{q:"Which of the following is NOT a characteristic of financial accounting?",o:["Summarized information","Historic in nature","Must conform to GAAP","Can be creative, with no GAAP requirement"],c:3,e:"Financial accounting is bound by GAAP precisely because outsiders rely on it and need comparability. The freedom to be creative belongs to managerial accounting, which has no external rulebook."},
{q:"Managerial accounting information is generated only when:",o:["The SEC requires it","The benefit of the information exceeds its cost","The auditors request it","The fiscal year closes"],c:1,e:"Because no outside body requires managerial reports, the only test is whether the report is worth what it costs to produce. If gathering the data costs more than the better decision is worth, the company skips it."},
{q:"A single owner who typically manages the daily operations describes a:",o:["Partnership","Corporation","Sole proprietorship","Board of directors"],c:2,e:"A sole proprietorship has exactly one owner, and that owner usually runs the business day to day. A partnership has two or more owners; a corporation has many owners who typically do not manage operations."},
{q:"Which of the following is an advantage of the corporate form of ownership?",o:["Double taxation","Limited liability","Paperwork and formalities","Owners must manage operations"],c:1,e:"Limited liability means a shareholder can lose the money invested but not personal assets beyond that. Double taxation and the paperwork burden are the two main disadvantages of incorporating."},
{q:"Double taxation refers to:",o:["Paying both federal and state income tax","Corporate profits being taxed, then dividends and capital gains being taxed again","Being audited twice in the same year","Filing two separate tax returns"],c:1,e:"The same dollar of earnings gets hit twice: once as corporate profit, then again when it reaches the shareholder as a dividend or capital gain. This is the price of the corporate form."},
{q:"Shareholders of large corporations typically:",o:["Manage the day-to-day operations","Provide resources such as cash in exchange for stock ownership and rely on financial statements","Prepare the financial statements","Set accounting standards"],c:1,e:"Shareholders of large companies are investors, not operators. Because they are not inside the business, they depend on the financial statements to evaluate management, assess financial condition, and predict future success."},
{q:"The board of directors is:",o:["Appointed by management","Elected by shareholders to represent shareholder interest and oversee management","Required only of privately held companies","Responsible for performing the audit"],c:1,e:"The board works for the shareholders, not for management, and is legally required for publicly traded companies. It uses financial accounting information to review results and evaluate management performance."},
{q:"Which sequence describes the basic business activities?",o:["Operating, planning, investing, financing","Planning, financing, investing, operating","Investing, operating, financing, planning","Financing, planning, operating, investing"],c:1,e:"A business plans first, then raises the money (financing), then spends it on resources (investing), then actually runs the business (operating). Planning always comes first because it sets what the other three are for."},
{q:"Operating activities are:",o:["Acquiring and disposing of long-term assets","The production, promotion, and selling of products and services","Methods used to fund investments","Issuing stock and borrowing money"],c:1,e:"Operating activities are the day-to-day business: making the product, marketing it, and selling it. Buying assets is investing; raising money is financing."},
{q:"Investing activities consist of:",o:["Acquiring and disposing of the resources a company uses to produce and sell its products","Generating revenue from customers","Obtaining cash from creditors and owners","Paying dividends to shareholders"],c:0,e:"Investing here means buying and selling the assets the business runs on, such as equipment and buildings. It does not mean investing in the stock market."},
{q:"Financing activities draw on which two sources?",o:["Operating and investing activities","Debt financing from creditors and equity financing from owners","Revenues and expenses","Assets and liabilities"],c:1,e:"There are only two places outside money comes from: lenders (debt) and owners (equity). Those two sources are exactly what shows up on the right side of the balance sheet as liabilities and equity."},
{q:"The accounting equation is:",o:["Assets + Liabilities = Equity","Assets = Liabilities + Equity","Revenues - Expenses = Assets","Assets = Equity - Liabilities"],c:1,e:"Everything the company owns had to be funded by either a creditor or an owner, so assets always equal liabilities plus equity. This equation is the entire structure of the balance sheet."},
{q:"Liabilities represent:",o:["Owner claims on assets","Nonowner claims on assets","Economic resources","Revenues earned but not yet collected"],c:1,e:"A liability is a claim on the company's assets held by someone who is not an owner, such as a lender or supplier. Equity is the owner claim on those same assets."},
{q:"Which financial statement reports performance over a period of time?",o:["Balance sheet","Income statement","Statement of financial position","None of these"],c:1,e:"The income statement covers a span of time, such as a month, quarter, or year. The balance sheet (also called the statement of financial position) is a snapshot at one single date."},
{q:"Which of the following is NOT another name for the income statement?",o:["Statement of operations","Statement of earnings","Statement of financial position","Statement of profit and loss"],c:2,e:"Statement of financial position is the alternate name for the balance sheet, not the income statement. The income statement goes by statement of income, earnings, operations, or profit and loss."},
{q:"The balance sheet reports:",o:["The results of operations over a period of time","The company's financial position at a point in time","Changes in equity over a period of time","Net cash flows over a period of time"],c:1,e:"The balance sheet is dated as of one specific day, which is why it is a snapshot rather than a movie. It lists the company's investments (assets) and its sources of financing (liabilities and equity)."},
{q:"Retained earnings is:",o:["Cash the company holds in reserve","Amounts received from issuing new stock","Cumulative income since the company began business minus dividends paid to shareholders","Net income for the current period only"],c:2,e:"Retained earnings is a running total across the entire life of the company, not a single period, and it is reduced by every dividend ever paid. It is an equity balance, not a pile of cash."},
{q:"Contributed capital consists of:",o:["Common stock and additional paid-in capital","Retained earnings and dividends","Revenues and expenses","Assets and liabilities"],c:0,e:"Contributed capital is what owners paid in directly when they bought stock, split between the stock's par value and anything paid above it. Retained earnings is earned capital, which is a different source."},
{q:"Operating cash flows differ from net income because:",o:["Net income excludes revenue","Of differences in the timing of when revenues and expenses are recorded versus when cash is received and paid","Cash flows include dividends but net income does not","GAAP requires two different equations"],c:1,e:"Revenue can be recorded before the customer pays, and expenses can be recorded before the bill is paid, so profit and cash movement land in different periods. That timing gap is the entire reason a separate cash flow statement exists."},
{q:"A fiscal year is:",o:["Always January 1 through December 31","A one-year reporting period that may end on a date other than December 31","A quarterly reporting period","The period covered by an audit"],c:1,e:"A fiscal year, also called an accounting year, is any 12-month reporting period. Companies often end it at a natural slow point in their business rather than at December 31."},
{q:"GAAP is best described as:",o:["Federal tax law","Standards and accepted practices designed to guide the preparation of financial statements","Internal company policy","Auditing procedures only"],c:1,e:"GAAP is the rulebook for preparing financial statements, and it still leaves preparers considerable discretion. Its purpose is to let external users rely on audited statements."},
{q:"The SEC:",o:["Prepares company financial statements","Regulates the issuance and trading of securities in the U.S.","Performs the audits of public companies","Writes international accounting standards"],c:1,e:"The SEC is the government regulator over securities issuance and trading, and it requires periodic reports from companies that cross its size and ownership thresholds. Independent audit firms, not the SEC, perform audits."},
{q:"Which body currently establishes accounting standards in the United States?",o:["SEC","PCAOB","FASB","IASB"],c:2,e:"The FASB sets U.S. accounting standards and wrote the Conceptual Framework as a guide for issues no specific standard covers. The PCAOB handles auditing standards, and the IASB writes international standards."},
{q:"Who prepares the financial statements and takes responsibility for what is disclosed in them?",o:["The independent auditor","Management","The SEC","The board of directors"],c:1,e:"Management both prepares the statements and owns responsibility for their accuracy and completeness. The independent auditor only expresses an opinion on what management produced."},
{q:"A \"clean\" audit opinion indicates that:",o:["The financial statements are guaranteed to be accurate","The auditors believe the statements present fairly the economic condition of the firm","No fraud occurred during the year","The company complied with all tax law"],c:1,e:"A clean opinion is a professional judgment that the statements present fairly and follow GAAP. It is explicitly not a guarantee of accuracy and not a guarantee that no fraud exists."},
{q:"The Sarbanes-Oxley Act established which body to approve auditing standards and monitor audit quality?",o:["FASB","SEC","PCAOB","IASB"],c:2,e:"SOX created the PCAOB in 2002 after a wave of concern over the quality of corporate financial reporting. Its job is oversight of auditors and audit quality, which is separate from the FASB's job of setting accounting standards."},
{q:"The IASB:",o:["Has legal authority to impose its standards worldwide","Creates IFRS but has no legal authority to impose standards in any country","Replaced the FASB in the United States","Performs audits of multinational companies"],c:1,e:"The IASB writes IFRS to make financial information more comparable across countries, but adoption is up to each country's own regulators. It has no enforcement power of its own."},
{q:"Refers to whether or not a particular amount is large enough to affect a decision.",o:["Materiality","Relevance","Timeliness","Verifiability"],c:0,e:"Materiality is a size test. If an amount is too small to change anyone's decision, the cost of applying full GAAP treatment to it is not worth it."},
{q:"The activities of a business are considered to be independent and distinct from those of its owners or from other companies.",o:["Going concern","Economic entity","Accounting period","Monetary unit"],c:1,e:"The economic entity assumption draws a line around the business so the owner's personal transactions never mix into company records. Your slides also call this the separate economic entity assumption."},
{q:"Accounting information should enable users to identify similarities and differences between sets of economic phenomena.",o:["Consistency","Comparability","Verifiability","Neutrality"],c:1,e:"Comparability is about comparing across different things, typically two companies. Consistency is the related but narrower idea of the same company using the same methods period after period."},
{q:"Financial reporting information must be available to decision makers before it loses its capacity to influence decisions.",o:["Relevance","Predictive value","Timeliness","Feedback value"],c:2,e:"Timeliness is one of the three components of relevance, along with predictive value and feedback value. Correct information that arrives after the decision is made has no value."},
{q:"Information is useful if it has the ability to influence decisions.",o:["Reliability","Relevance","Materiality","Understandability"],c:1,e:"Relevance means the information can actually make a difference in a decision. Reliability is the separate requirement that the information be accurate and unbiased."},
{q:"Consensus among measures assures that the information is free of error.",o:["Verifiability","Neutrality","Representational faithfulness","Consistency"],c:0,e:"Verifiability means independent people measuring the same thing would arrive at the same answer. It is one of the three components of reliability, with representational faithfulness and neutrality."},
{q:"Accounting information should reflect the underlying economic events that it purports to measure.",o:["Comparability","Verifiability","Representational faithfulness","Neutrality"],c:2,e:"Representational faithfulness means the number on the page actually matches the real economic event behind it. It is a component of reliability."},
{q:"The financial reports are presented in one consistent monetary unit, such as U.S. dollars.",o:["Accounting period","Economic entity","Monetary unit","Going concern"],c:2,e:"The monetary unit assumption means everything reported is expressed in one currency, the dollar in the U.S. Your slides also refer to this as the measuring unit assumption."},
{q:"A business is expected to have continuity in that it is expected to continue to operate indefinitely.",o:["Economic entity","Going concern","Accounting period","Consistency"],c:1,e:"The going concern assumption lets the company report assets at cost rather than at liquidation value, because it is not about to shut down. If that assumption fails, the accounting changes."},
{q:"The life of a business can be divided into discrete accounting periods such as a year or quarter.",o:["Going concern","Accounting period","Timeliness","Monetary unit"],c:1,e:"The accounting period assumption is what makes periodic reporting possible: you cut the continuous life of a business into slices and report on each one. Without it there would be nothing to report until the company closed."},
{q:"Materiality means that:",o:["All information must comply with GAAP regardless of size","Information that is not large enough to affect one's decision need not comply with GAAP","Only large companies must follow GAAP","All material assets must be physically inspected"],c:1,e:"Materiality is a practical exception built into GAAP. If an amount cannot change a user's decision, strict compliance is not required for it."},
{q:"The matching principle states that:",o:["Assets must equal liabilities plus equity","The efforts of a given period (expenses) should be matched against the benefits (revenues) they generate","Cash receipts must match cash payments","Debits must equal credits"],c:1,e:"Matching is about timing: an expense is recognized in the period whose revenue it helped produce, not when the cash moved. Inventory sits on the balance sheet as an asset until the sale happens, then becomes cost of goods sold."}
];
BANK.ch2mc = [
{q:"Assets are:",o:["Amounts owed to creditors","Resources that are expected to provide a company with future economic benefits","Revenues earned during the period","Owner contributions of cash"],c:1,e:"An asset is defined by what it will do for you in the future, not by what it cost. If a payment buys no future benefit, it is an expense instead."},
{q:"Which of the following is NOT required for an expenditure to be capitalized as an asset?",o:["It must be owned or controlled by the company","It must possess expected future benefits that can be measured","A monetary value must be assignable to it","It must be paid for in cash"],c:3,e:"Capitalizing does not depend on how you paid; an asset bought entirely on credit still goes on the balance sheet. The three real tests are ownership or control, measurable future benefit, and an assignable monetary value."},
{q:"An expenditure that is not capitalized is:",o:["Ignored entirely","Expensed on the income statement","Recorded as a liability","Added directly to equity"],c:1,e:"Every expenditure goes one of two places: onto the balance sheet as an asset (capitalized) or onto the income statement as an expense. If there is no measurable future benefit, it is expensed now."},
{q:"Current assets are:",o:["Listed after noncurrent assets on the balance sheet","Expected to be converted into cash or used in operations within the next year or operating cycle","Never converted into cash","Always intangible"],c:1,e:"The dividing line is one year, or one operating cycle if that is longer. Current assets are listed first on the balance sheet, before noncurrent assets."},
{q:"Current assets are listed in order of:",o:["Dollar amount","Liquidity","Maturity","Alphabetical order"],c:1,e:"Liquidity means how quickly something turns into cash, so cash itself is listed first. Order of maturity is how current liabilities are listed, not current assets."},
{q:"Amounts due to the company from customers arising from the sale of products or services on credit are:",o:["Accounts payable","Accounts receivable","Unearned revenue","Marketable securities"],c:1,e:"Receivable means money coming in to you; payable means money going out. A receivable arises when you deliver first and collect later."},
{q:"Costs paid in advance for rent, insurance, or other services are:",o:["Accrued liabilities","Prepaid expenses","Deferred revenue","Intangible assets"],c:1,e:"Paying in advance buys a future benefit, so it is an asset until that benefit is used up. Despite the word expense in the name, a prepaid expense sits on the balance sheet."},
{q:"Short-term investments that can be quickly sold to raise cash are:",o:["Marketable securities","Long-term financial investments","Inventory","Goodwill"],c:0,e:"Marketable securities are current assets because management intends to convert them to cash soon. The same kind of security held with no near-term intent to sell is a long-term financial investment."},
{q:"Patents, trademarks, franchise rights, and goodwill are:",o:["Current assets","Intangible assets","Accrued liabilities","Contributed capital"],c:1,e:"These provide future benefits but have no physical substance, which is exactly what makes them intangible. They are reported as noncurrent assets."},
{q:"Which asset is typically measured at historical cost?",o:["Accounts receivable","Inventory","Property, plant and equipment","Marketable equity securities"],c:2,e:"PPE stays on the books at what the company originally paid, not at what it is worth today. Different asset types use different measurement bases, which is why this list is worth memorizing."},
{q:"Inventory is measured at:",o:["Historical cost","Net realizable value","The lower of cost or net realizable value","Fair market value"],c:2,e:"Inventory uses whichever is lower, cost or net realizable value, so losses get recognized but gains do not. That conservatism is the point of the rule."},
{q:"Accounts receivable is measured at:",o:["Historical cost","Net realizable value","Fair market value","Par value"],c:1,e:"Receivables are reported at the amount the company actually expects to collect, not the full face amount billed. Some customers never pay, and net realizable value reflects that."},
{q:"Liabilities and equity both represent:",o:["Economic resources the company controls","Sources of capital used to finance the acquisition of assets","Expenses of the current period","Revenues earned during the period"],c:1,e:"The right side of the balance sheet answers one question: where did the money come from? Liabilities are borrowed sources, equity is owner sources, and together they fund every asset on the left side."},
{q:"Which of the following is NOT one of the three conditions for reporting a liability?",o:["A future sacrifice is probable","The amount of the obligation is known or can be reasonably estimated","The transaction or event that caused the obligation has occurred","The obligation is due within one year"],c:3,e:"Being due within a year determines whether a liability is current or noncurrent; it does not determine whether it gets recorded at all. The three real conditions are probable sacrifice, measurable amount, and a past causing event."},
{q:"Current liabilities are listed in order of:",o:["Liquidity","Maturity","Size","Account number"],c:1,e:"Liabilities are ordered by when they come due, soonest first. Assets are the ones ordered by liquidity."},
{q:"Obligations for expenses that have been recorded but not yet paid are:",o:["Accounts payable","Accrued liabilities","Unearned revenue","Short-term borrowings"],c:1,e:"An accrued liability is the gap between recording an expense and paying it, such as wages earned by employees but not yet paid out. Accounts payable specifically covers amounts owed to suppliers for goods and services purchased on credit."},
{q:"An obligation created when a company accepts payment in advance for goods or services it will deliver in the future is:",o:["Accounts receivable","Prepaid expense","Deferred (unearned) revenue","Accrued liability"],c:2,e:"Cash received before delivery is not revenue yet, it is a promise to deliver, which makes it a liability. It becomes revenue only once the company does the work."},
{q:"The portion of long-term debt due to be paid within one year is reported as:",o:["Long-term debt","Current maturities of long-term debt","Accrued liabilities","Equity"],c:1,e:"A long-term loan gets split each year: the piece due within twelve months moves into current liabilities, the rest stays noncurrent. This is why one loan can appear in two places on the balance sheet."},
{q:"Stockholders' equity reflects capital provided by the owners and represents a:",o:["Senior claim on assets ahead of creditors","Residual interest","Liability of the company","Contingent obligation"],c:1,e:"Residual means owners get what is left after creditors are paid, which follows directly from Assets minus Liabilities equals Equity. Owners are last in line, which is why they carry the most risk."},
{q:"Additional paid-in capital is:",o:["The par value or stated value of stock issued","Amounts received from the primary owners above the par or stated value of the common stock","Accumulated earnings that have not been distributed","The amount paid to reacquire the company's own stock"],c:1,e:"When stock sells for more than its par value, the par portion goes to common stock and the excess goes to additional paid-in capital. Both are contributed capital; the split is just bookkeeping."},
{q:"Treasury stock is:",o:["Government securities the company holds as an investment","The amount paid to reacquire the company's own common stock","Stock issued to employees as compensation","Shares authorized but never issued"],c:1,e:"Treasury stock is the company buying its own shares back, which reduces equity because it is the opposite of issuing stock. It has nothing to do with U.S. Treasury securities."},
{q:"Retained earnings is:",o:["Contributed capital","The accumulated earnings that have not been distributed to stockholders as dividends","Cash set aside for future expansion","Net income for the current period only"],c:1,e:"Retained earnings accumulates over the company's whole life and is reduced by dividends. It is earned capital, not contributed capital, and it is not a cash account."},
{q:"Which two items are classified as earned capital?",o:["Common stock and additional paid-in capital","Retained earnings and accumulated other comprehensive income","Treasury stock and common stock","Accounts payable and accrued liabilities"],c:1,e:"Earned capital is equity the company generated itself rather than collected from owners. Common stock, additional paid-in capital, and treasury stock are all contributed capital."},
{q:"Which of the following correctly states the retained earnings calculation?",o:["Beginning retained earnings + Net income + Dividends","Beginning retained earnings + Net income - Dividends","Beginning retained earnings - Net income + Dividends","Beginning retained earnings + Dividends - Net loss"],c:1,e:"Profit adds to retained earnings and dividends take away from it, so income is added and dividends are subtracted. A net loss would be subtracted instead of added."},
{q:"Retained earnings is important structurally because it:",o:["Links the income statement to the balance sheet","Links the balance sheet to the statement of cash flows","Measures the company's liquidity","Always equals total equity"],c:0,e:"Net income from the income statement flows into retained earnings, which is reported in equity on the balance sheet. That single account is the bridge between the two statements."},
{q:"Revenues minus cost of goods sold equals:",o:["Net income","Gross profit","Operating income","Retained earnings"],c:1,e:"Gross profit is the first stop on the income statement, measuring what is left after the direct cost of the product. Subtracting operating expenses and other items from gross profit eventually gets you to net income."},
{q:"Expenses are:",o:["Increases in net assets from delivering goods to customers","The outflow or use of assets to generate revenues","Distributions of profit to owners","Amounts borrowed from creditors"],c:1,e:"Expenses are resources consumed in the effort to produce revenue, which is why they decrease net assets. Dividends are distributions to owners, not expenses."},
{q:"Operating expenses are:",o:["Costs relating to financing and investing activities","Usual and customary costs incurred to support the main business activities","Distributions to shareholders","Only cost of goods sold"],c:1,e:"Operating expenses are the routine costs of running the core business, such as wages, rent, and advertising. Interest is a financing cost, so it is nonoperating."},
{q:"Interest revenue and interest expense are classified as:",o:["Operating items","Nonoperating items relating to financing and investing activities","Equity transactions","Current liabilities"],c:1,e:"Interest comes from how the company is financed or where it parked its cash, not from selling its product. Companies segregate these because operating and nonoperating results offer different insights into performance."},
{q:"Cash-basis accounting recognizes revenues and expenses:",o:["When earned and incurred","Only when cash is received or paid","At the end of the fiscal year","When the audit is complete"],c:1,e:"Cash basis follows the bank account: no cash movement, no entry. That is simple but it can badly misstate performance when sales and collections fall in different periods."},
{q:"Which basis of accounting is required by U.S. GAAP and IFRS?",o:["Cash basis","Accrual basis","Tax basis","Modified cash basis"],c:1,e:"Accrual accounting records revenue when it is earned and expenses when they are incurred, regardless of cash timing. Both U.S. GAAP and IFRS require it because it measures performance better than cash basis."},
{q:"Revenue recognition requires that revenue be recorded only when it is:",o:["Collected in cash","Earned and realized or realizable","Included in the budget","Approved by the auditor"],c:1,e:"Two conditions must both hold: the company has done the work (earned) and payment is received or reasonably assured (realized or realizable). This is why a credit sale counts as revenue immediately even though no cash has arrived."}
];
BANK.ch1fib = [
{q:"___ accounting is designed primarily for decision makers outside the company.",a:[["financial"]],e:"Financial accounting serves external users and must follow GAAP. Managerial accounting is the internal counterpart."},
{q:"___ accounting information is future oriented, highly detailed, and not bound by GAAP.",a:[["managerial","management"]],e:"Because only insiders use it, managerial accounting has no external rulebook and can be as detailed and forward looking as managers need."},
{q:"Two or more owners who are usually involved in managing the business describes a ___.",a:[["partnership"]],e:"A partnership has multiple owners who typically run the business themselves, unlike a corporation where ownership and management are separated."},
{q:"A corporation is a separate legal ___.",a:[["entity"]],e:"Being its own legal entity is what allows a corporation to give owners limited liability and to survive changes in ownership."},
{q:"Owners of a corporation benefit from ___ liability.",a:[["limited"]],e:"Shareholders can lose what they invested but creditors cannot reach their personal assets beyond that. This is the biggest advantage of incorporating."},
{q:"___ taxation is a disadvantage of the corporate form.",a:[["double"]],e:"Corporate profits are taxed once at the company level, then again when distributed to shareholders as dividends or realized as capital gains."},
{q:"The ___ is elected by shareholders to represent their interest and oversee management.",a:[["board of directors","board"]],e:"The board answers to shareholders, not to management, and is legally required for publicly traded companies."},
{q:"___ activities consist of acquiring and disposing of the assets a company uses to produce and sell its products.",a:[["investing"]],e:"Investing here means buying and selling the resources the business runs on, such as equipment and buildings, not buying stocks."},
{q:"___ activities are the production, promotion, and selling of products and services.",a:[["operating"]],e:"Operating activities are the day-to-day running of the business, which is where revenues and most expenses come from."},
{q:"Funding investments through creditors is ___ financing, while funding through owners is ___ financing.",a:[["debt"],["equity","owner"]],e:"There are only two outside sources of capital: lenders and owners. They appear on the balance sheet as liabilities and equity."},
{q:"The accounting equation is Assets = ___ + ___.",a:[["liabilities"],["equity","stockholders equity","shareholders equity","owners equity"]],e:"Every asset was funded either by a creditor or by an owner, so the two sides always balance. This equation is the structure of the balance sheet."},

function editDistance(a, b) {
  if (a === b) return 0;
  var m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  if (Math.abs(m - n) > 4) return Math.abs(m - n);
  var prev = [], cur = [], i, j;

    for (j = 1; j <= n; j++) {

      cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);

      feedback.querySelector(".feedback-explain").textContent = item.e;
      feedback.hidden = false;
    }

    if (mode.type === "mc") {
      card.appendChild(h('<h2 class="exam-question">' + escapeHtml(item.q) + "</h2>"));
      var choices = h('<div class="choices"></div>');
      var order = shuffle(item.o.map(function (_, i) { return i; }));
      var correctDisplay = order.indexOf(item.c);
      var done = false;
      order.forEach(function (orig, disp) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn";
        btn.innerHTML = '<span class="choice-letter">' + LETTERS[disp] + '</span><span>' + escapeHtml(item.o[orig]) + "</span>";
        btn.addEventListener("click", function () {
          if (done) return;
          done = true;
          Array.prototype.forEach.call(choices.children, function (c, idx) {
            c.disabled = true;
            if (idx === correctDisplay) c.classList.add("correct");
            else if (idx === disp) c.classList.add("incorrect");
            else c.classList.add("dim");
          });
          finish(disp === correctDisplay);
        });
        choices.appendChild(btn);
      });
      card.appendChild(choices);
    } else {
      var parts = item.q.split("___");
      var qEl = h('<h2 class="fib-q"></h2>');
      var inputs = [];
      parts.forEach(function (p, i) {
        qEl.appendChild(document.createTextNode(p));
        if (i < parts.length - 1) {
          var inp = document.createElement("input");
          inp.type = "text";
          inp.className = "blank-input";
          inp.autocapitalize = "off";
          inp.autocomplete = "off";
          inp.spellcheck = false;
          inputs.push(inp);
          qEl.appendChild(inp);
        }
      });
      card.appendChild(qEl);
      var keyLine = h('<p class="answer-key" hidden></p>');
      card.appendChild(keyLine);
      var checkBtn = h('<button type="button" class="check-sm">Check</button>');
      var checked = false;
      function doCheck() {
        if (checked) return;
        checked = true;
        var allRight = true, keys = [];
        inputs.forEach(function (inp, i) {
          var ok = matchText(inp.value, item.a[i]);
          inp.classList.add(ok ? "right" : "wrong");
          inp.readOnly = true;
          if (!ok) allRight = false;
          keys.push(item.a[i][0]);
        });
        if (!allRight) {
          keyLine.textContent = "Answer: " + keys.join(", ");
          keyLine.hidden = false;
        }
        checkBtn.hidden = true;
        finish(allRight);
      }
      checkBtn.addEventListener("click", doCheck);
      inputs.forEach(function (inp) {
        inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doCheck(); } });
      });
      card.appendChild(checkBtn);
    }

    card.appendChild(feedback);
    wrap.appendChild(card);
  });

  var sb = h('<div class="start-bar" style="margin-top:26px"></div>');
  var again = h('<button type="button" class="stamp-btn"><span>Shuffle and start over</span></button>');
  again.addEventListener("click", function () { startQuiz(mode); });
  var back = h('<button type="button" class="link-btn">Pick a different drill</button>');
  back.addEventListener("click", showHome);
  sb.appendChild(again);
  sb.appendChild(back);
  wrap.appendChild(sb);
  render(wrap);
}

/* ---------- balance sheet builder ---------- */
var BS_ACCOUNTS = {
  ca: [
    { label: "Cash", alias: ["cash", "cash and equivalents", "cash and cash equivalents"], min: 600, max: 9000, always: true },
    { label: "Accounts receivable", alias: ["accounts receivable", "receivables", "ar", "accounts receivables"], min: 400, max: 6500, always: true },
    { label: "Inventory", alias: ["inventory", "inventories", "merchandise inventory"], min: 500, max: 8000, always: true },
    { label: "Prepaid expenses", alias: ["prepaid expenses", "prepaid expense", "prepaids", "prepaid", "prepaid insurance"], min: 90, max: 1400 }
  ],
  cl: [
    { label: "Accounts payable", alias: ["accounts payable", "payables", "ap", "accounts payables"], min: 500, max: 7000, always: true },
    { label: "Wages payable", alias: ["wages payable", "wage payable", "salaries payable", "wages owed"], min: 100, max: 2200 },
    { label: "Unearned revenue", alias: ["unearned revenue", "deferred revenue", "unearned revenues"], min: 100, max: 1800 }
  ],
  ncl: [
    { label: "Long-term debt", alias: ["long term debt", "long term debts", "bonds payable", "long term notes payable"], min: 1500, max: 18000, always: true },
    { label: "Other long-term liabilities", alias: ["other long term liabilities", "other long term liability", "other noncurrent liabilities"], min: 300, max: 5000 }
  ],
  eq: [
    { label: "Common stock", alias: ["common stock", "stock", "capital stock", "contributed capital"], min: 800, max: 14000, always: true },
    { label: "Retained earnings", alias: ["retained earnings", "retained earnings deficit", "earned capital"], plug: true, always: true }
  ]
};

// two ways a company can present its long-lived assets; the scenario picks one
var BS_NCA_PRESENTATIONS = [
  [
    { label: "Land", alias: ["land"], min: 1200, max: 12000 },
    { label: "Equipment, net", alias: ["equipment net", "equipment", "equipment net of depreciation"], min: 2500, max: 22000 }
  ],
  [
    { label: "Property, plant and equipment, net", alias: ["property plant and equipment net", "property plant and equipment", "ppe", "ppe net", "property plant equipment"], min: 3000, max: 30000 }
  ],
  [
    { label: "Land", alias: ["land"], min: 1200, max: 12000 },
    { label: "Buildings, net", alias: ["buildings net", "buildings", "building net", "buildings net of depreciation"], min: 3000, max: 24000 },
    { label: "Equipment, net", alias: ["equipment net", "equipment", "equipment net of depreciation"], min: 2000, max: 16000 }
  ]
];

var BS_DISTRACTORS = ["Sales revenue", "Cost of goods sold", "Wages expense", "Dividends paid", "Net income", "Gross profit"];

function chooseAccounts(list) {
  var always = list.filter(function (a) { return a.always; });
  var optional = list.filter(function (a) { return !a.always; });
  var take = optional.length ? rnd(optional.length > 1 ? 1 : 0, optional.length) : 0;
  var chosen = shuffle(optional).slice(0, take);
  return list.filter(function (a) { return a.always || chosen.indexOf(a) !== -1; });
}

function makeBalanceSheet(hidePlug) {
  var p, tries = 0;
  var nca = pick(BS_NCA_PRESENTATIONS);
  do {
    p = { sections: {} };
    ["ca", "cl", "ncl", "eq"].forEach(function (sec) {
      p.sections[sec] = chooseAccounts(BS_ACCOUNTS[sec]).map(function (a) {
        return { label: a.label, alias: a.alias, plug: !!a.plug, amt: a.plug ? 0 : rnd(a.min, a.max, 1) };
      });
    });
    p.sections.nca = nca.map(function (a) {
      return { label: a.label, alias: a.alias, plug: false, amt: rnd(a.min, a.max, 1) };
    });
    var sum = function (sec) { return p.sections[sec].reduce(function (t, r) { return t + r.amt; }, 0); };
    p.tca = sum("ca");
    p.ta = p.tca + sum("nca");
    p.tcl = sum("cl");
    p.tl = p.tcl + sum("ncl");
    var plugRow = p.sections.eq.filter(function (r) { return r.plug; })[0];
    plugRow.amt = p.ta - p.tl - p.sections.eq.reduce(function (t, r) { return t + (r.plug ? 0 : r.amt); }, 0);
    p.re = plugRow.amt;
    p.te = sum("eq");
    tries++;
  } while ((p.re < -2200 || p.re > p.ta * 0.6 || p.tl > p.ta * 0.88 || p.tl < p.ta * 0.25) && tries < 600);

  var biz = pick(BANK.biz);
  p.company = biz.n;
  p.descr = biz.d;
  p.unit = pick(BANK.units);
  p.date = pick(BANK.dates);
  p.hidePlug = !!hidePlug;
  var facts = [];
  ["ca", "nca", "cl", "ncl", "eq"].forEach(function (sec) {
    p.sections[sec].forEach(function (r) {
      if (r.plug && hidePlug) return;
      facts.push([r.label, r.amt]);
    });
  });
  p.facts = shuffle(facts);
  return p;
}

function buildBsRows(p) {
  var rows = [], fieldKeys = [];
  rows.push({ t: "head", text: "Assets" });
  ["ca", "nca"].forEach(function (sec) {
    p.sections[sec].forEach(function (r, i) {
      fieldKeys.push({ key: sec + i, sec: sec, row: r });
      rows.push({ t: "in", key: sec + i, sec: sec, indent: true });
    });
    if (sec === "ca") rows.push({ t: "calc", calc: "tca", text: "Total current assets", cls: "total", indent: true });
  });
  rows.push({ t: "calc", calc: "ta", text: "Total assets", cls: "grand" });
  rows.push({ t: "head", text: "Liabilities and stockholders' equity" });
  ["cl", "ncl"].forEach(function (sec) {
    p.sections[sec].forEach(function (r, i) {
      fieldKeys.push({ key: sec + i, sec: sec, row: r });
      rows.push({ t: "in", key: sec + i, sec: sec, indent: true });
    });
    if (sec === "cl") rows.push({ t: "calc", calc: "tcl", text: "Total current liabilities", cls: "total", indent: true });
  });
  rows.push({ t: "calc", calc: "tl", text: "Total liabilities", cls: "total" });
  rows.push({ t: "head", text: "Stockholders' equity" });
  p.sections.eq.forEach(function (r, i) {
    fieldKeys.push({ key: "eq" + i, sec: "eq", row: r });
    rows.push({ t: "in", key: "eq" + i, sec: "eq", indent: true });
  });
  rows.push({ t: "calc", calc: "te", text: "Total stockholders' equity", cls: "total", indent: true });
  rows.push({ t: "calc", calc: "tle", text: "Total liabilities and stockholders' equity", cls: "grand" });
  return { rows: rows, fieldKeys: fieldKeys };
}

function startStatement(mode) {
  var isDrop = mode.variant === "dropdown";
  var prob = makeBalanceSheet(!isDrop);
  var built = buildBsRows(prob);
  var wrap = document.createElement("div");

  var bar = h('<div class="topbar"></div>');
  bar.appendChild(homeLink());
  bar.appendChild(h('<div class="topbar-label">' + (isDrop ? "Dropdown account names" : "Everything blank") + "</div>"));
  wrap.appendChild(bar);

  var factList = prob.facts.map(function (f) {
    return "<li>" + escapeHtml(f[0]) + ", $" + fmt(f[1]) + (f[1] < 0 ? " (a deficit)" : "") + "</li>";
  }).join("");
  var ask = isDrop
    ? "Build the classified balance sheet below. The accounts above are listed in no particular order, so you have to sort them into current assets, noncurrent assets, current liabilities, noncurrent liabilities, and equity yourself. Subtotals and totals add themselves up as you type."
    : "<strong>Retained earnings is not given.</strong> Build the classified balance sheet below, then solve for retained earnings using the accounting equation. The accounts above are in no particular order, so you have to classify them yourself. Subtotals and totals add themselves up as you type.";
  wrap.appendChild(h('<div class="stmt-prompt"><h3>' + escapeHtml(prob.company) + "</h3>" +
    '<p class="ask" style="margin-top:0;margin-bottom:11px">' + escapeHtml(prob.descr.charAt(0).toUpperCase() + prob.descr.slice(1)) +
    ", reports the following account balances as of " + escapeHtml(prob.date) + ", in " + prob.unit + ":</p>" +
    "<ul>" + factList + "</ul><p class=\"ask\">" + ask + "</p></div>"));

  var card = h('<div class="exam-card" style="padding-top:0"></div>');
  card.appendChild(h('<div class="stmt-head">' + escapeHtml(prob.company) + "<span>Balance Sheet</span><span>" + escapeHtml(prob.date) + "</span></div>"));
  var table = h('<table class="stmt-table"><tbody></tbody></table>');
  var tbody = table.querySelector("tbody");
  var amtFields = {}, lblFields = {}, calcCells = {};

  var labelPool = [];
  ["ca", "nca", "cl", "ncl", "eq"].forEach(function (sec) {
    prob.sections[sec].forEach(function (r) { labelPool.push(r.label); });
  });
  // a few plausible wrong turns, all income statement lines
  labelPool = labelPool.concat(shuffle(BS_DISTRACTORS).slice(0, 4));

  built.rows.forEach(function (r) {
    var tr = document.createElement("tr");
    var cls = [];
    if (r.indent) cls.push("indent");
    if (r.cls) cls.push(r.cls);
    var tdL = document.createElement("td");
    tdL.className = "lbl";
    var tdA = document.createElement("td");
    tdA.className = "amt";

    if (r.t === "head") {
      cls.push("head-row");
      tdL.textContent = r.text;
    } else if (r.t === "in") {
      if (isDrop) {
        var sel = document.createElement("select");
        sel.className = "lbl-select";
        sel.innerHTML = '<option value="">Select account</option>' + shuffle(labelPool).map(function (o) {
          return '<option value="' + escapeHtml(o) + '">' + escapeHtml(o) + "</option>";
        }).join("");
        tdL.appendChild(sel);
        lblFields[r.key] = sel;
      } else {
        var li = document.createElement("input");
        li.type = "text";
        li.className = "lbl-input";
        li.placeholder = "Account name";
        li.autocomplete = "off";
        li.spellcheck = false;
        tdL.appendChild(li);
        lblFields[r.key] = li;
      }
      var ai = document.createElement("input");
      ai.type = "text";
      ai.className = "amt-input";
      ai.inputMode = "numeric";
      ai.placeholder = "0";
      ai.autocomplete = "off";
      ai.addEventListener("input", recalc);
      tdA.appendChild(ai);
      amtFields[r.key] = ai;
    } else {
      tdL.textContent = r.text;
      tdA.className = "amt calc-cell";
      tdA.textContent = "\u2014";
      calcCells[r.calc] = tdA;
    }
    tr.className = cls.join(" ");
    tr.appendChild(tdL);
    tr.appendChild(tdA);
    tbody.appendChild(tr);
  });
  card.appendChild(table);
  var tieNote = h('<p class="tie-note" hidden></p>');
  card.appendChild(tieNote);
  wrap.appendChild(card);

  function keysIn(sec) {
    return built.fieldKeys.filter(function (f) { return f.sec === sec; }).map(function (f) { return f.key; });
  }
  function val(k) { var v = parseAmt(amtFields[k].value); return isNaN(v) ? 0 : v; }
  function sumSec(sec) { return keysIn(sec).reduce(function (t, k) { return t + val(k); }, 0); }
  function filled(secs) {
    return secs.some(function (sec) { return keysIn(sec).some(function (k) { return amtFields[k].value.trim() !== ""; }); });
  }

  function recalc() {
    var tca = sumSec("ca"), ta = tca + sumSec("nca");
    var tcl = sumSec("cl"), tl = tcl + sumSec("ncl");
    var te = sumSec("eq"), tle = tl + te;
    var set = function (name, v, show) { if (calcCells[name]) calcCells[name].textContent = show ? fmt(v) : "\u2014"; };
    set("tca", tca, filled(["ca"]));
    set("ta", ta, filled(["ca", "nca"]));
    set("tcl", tcl, filled(["cl"]));
    set("tl", tl, filled(["cl", "ncl"]));
    set("te", te, filled(["eq"]));
    set("tle", tle, filled(["cl", "ncl", "eq"]));
    var ready = filled(["ca", "nca"]) && filled(["cl", "ncl", "eq"]);
    ["ta", "tle"].forEach(function (n) { calcCells[n].classList.remove("tie", "notie"); });
    if (ready) {
      var balanced = ta === tle;
      ["ta", "tle"].forEach(function (n) { calcCells[n].classList.add(balanced ? "tie" : "notie"); });
      tieNote.hidden = false;
      tieNote.className = "tie-note " + (balanced ? "ok" : "bad");
      tieNote.textContent = balanced
        ? "Balanced. Total assets equal total liabilities and stockholders' equity."
        : "Not balanced. Total assets are " + fmt(ta) + " but liabilities plus equity come to " + fmt(tle) + ", a difference of " + fmt(Math.abs(ta - tle)) + ".";
    } else {
      tieNote.hidden = true;
    }
  }

  var sb = h('<div class="start-bar" style="margin-top:26px"></div>');
  var scoreLbl = h('<div class="topbar-label"></div>');
  var checkBtn = h('<button type="button" class="stamp-btn"><span>Check my work</span></button>');

  checkBtn.addEventListener("click", function () {
    var right = 0, total = 0;
    var allRows = built.fieldKeys.map(function (f) { return f.row; });
    ["ca", "nca", "cl", "ncl", "eq"].forEach(function (sec) {
      var keyRows = built.fieldKeys.filter(function (f) { return f.sec === sec; }).map(function (f) { return f.row; });
      var claimed = [];
      keysIn(sec).forEach(function (k) {
        total += 2;
        var lf = lblFields[k], af = amtFields[k];
        var hit = null;
        if (isDrop) {
          for (var i = 0; i < keyRows.length; i++) {
            if (claimed.indexOf(i) === -1 && lf.value === keyRows[i].label) { hit = i; break; }
          }
        } else {
          // closest unclaimed account in this section wins, and a typo only counts
          // if it is nearer to that account than to anything else on the statement
          var bestD = Infinity;
          for (var j = 0; j < keyRows.length; j++) {
            if (claimed.indexOf(j) !== -1) continue;
            var d = aliasDistance(lf.value, keyRows[j].alias);
            if (d < bestD) { bestD = d; hit = j; }
          }
          if (bestD === Infinity) hit = null;
          else if (bestD > 0) {
            var chosen = keyRows[hit];
            for (var q = 0; q < allRows.length; q++) {
              if (allRows[q] !== chosen && aliasDistance(lf.value, allRows[q].alias) < bestD) { hit = null; break; }
            }
          }
        }
        var lblOk = hit !== null;
        if (lblOk) claimed.push(hit);
        lf.classList.remove("right", "wrong");
        lf.classList.add(lblOk ? "right" : "wrong");
        if (lblOk) right++;
        var amtOk = lblOk && parseAmt(af.value) === keyRows[hit].amt;
        af.classList.remove("right", "wrong");
        af.classList.add(amtOk ? "right" : "wrong");
        if (amtOk) right++;
      });
    });
    scoreLbl.textContent = right + " of " + total + " boxes correct";

    var order = function (sec) {
      return built.fieldKeys.filter(function (f) { return f.sec === sec; })
        .map(function (f) { return f.row.label + " " + fmt(f.row.amt); }).join(", ");
    };
    var existing = wrap.querySelector(".review");
    if (existing) existing.remove();
    var key = h('<div class="review" style="margin-top:26px"></div>');
    key.appendChild(h('<h3 class="review-heading">Answer key</h3>'));
    key.appendChild(h('<div class="review-item">' +
      '<p class="review-correct">Current assets (' + fmt(prob.tca) + "): " + escapeHtml(order("ca")) + "</p>" +
      '<p class="review-correct">Noncurrent assets: ' + escapeHtml(order("nca")) + "</p>" +
      '<p class="review-correct">Total assets: ' + fmt(prob.ta) + "</p>" +
      '<p class="review-correct">Current liabilities (' + fmt(prob.tcl) + "): " + escapeHtml(order("cl")) + "</p>" +
      '<p class="review-correct">Noncurrent liabilities: ' + escapeHtml(order("ncl")) + "</p>" +
      '<p class="review-correct">Total liabilities: ' + fmt(prob.tl) + "</p>" +
      '<p class="review-correct">Stockholders\' equity (' + fmt(prob.te) + "): " + escapeHtml(order("eq")) + "</p>" +
      '<p class="review-explain">' +
      (prob.hidePlug
        ? "Retained earnings is the plug: rearrange Assets = Liabilities + Equity to get retained earnings = total assets minus total liabilities minus common stock, so " + fmt(prob.ta) + " minus " + fmt(prob.tl) + " minus " + fmt(prob.te - prob.re) + " equals " + fmt(prob.re) + ". "
        : "Every amount was given, so the work here is classification: current means it converts to cash or comes due within one year or the operating cycle. ") +
      "The equity section has two pieces and only two: common stock, which is the contributed capital the owners paid in, and retained earnings, which is the earned capital the company generated itself. " +
      "Current assets are listed in order of liquidity and current liabilities in order of maturity, which is the order shown above. Your line order is not graded, only whether each account landed in the right section with the right amount.</p></div>"));
    wrap.appendChild(key);
    scrollTop();
  });

  var newNums = h('<button type="button" class="link-btn">New problem</button>');
  newNums.addEventListener("click", function () { startStatement(mode); });
  sb.appendChild(scoreLbl);
  sb.appendChild(checkBtn);
  wrap.appendChild(sb);
  var nav = h('<div class="nav-row"></div>');
  nav.appendChild(newNums);
  wrap.appendChild(nav);
  render(wrap);
}

/* ---------- income statement builder ---------- */
var IS_ROWS = [
  { t: "in", key: "sales", label: "Net sales", alias: ["net sales", "sales", "sales revenue", "net revenues", "net revenue", "revenues", "revenue"] },
  { t: "in", key: "cogs", label: "Cost of goods sold", alias: ["cost of goods sold", "cogs", "cost of sales", "cost of goods"] },
  { t: "calc", calc: "gross", text: "Gross profit", cls: "total" },
  { t: "in", key: "sga", label: "Selling, general, administrative expenses", alias: ["selling general administrative expenses", "selling general and administrative expenses", "sga", "sg a", "selling general and administrative", "operating expenses", "selling general administrative"] },
  { t: "calc", calc: "op", text: "Operating income", cls: "total" },
  { t: "in", key: "interest", label: "Interest expense", alias: ["interest expense", "interest"] },
  { t: "calc", calc: "net", text: "Net income", cls: "grand" }
];

var IS_LABEL_POOL = [
  "Net sales", "Cost of goods sold", "Selling, general, administrative expenses", "Interest expense",
  "Gross profit", "Operating income", "Net income", "Accounts payable", "Inventory",
  "Retained earnings", "Cash", "Dividends paid"
];

var IS_PROFILES = [
  { d: "a high volume retailer, where most of every sales dollar goes to the cost of the product", cogs: [64, 79], sga: [11, 20] },
  { d: "a manufacturer that makes what it sells", cogs: [52, 67], sga: [14, 24] },
  { d: "a premium brand that sells at a wide markup but spends heavily on marketing", cogs: [36, 50], sga: [22, 36] },
  { d: "a distributor running on thin margins", cogs: [70, 82], sga: [8, 15] }
];

function makeIncomeStatement(hideCogs) {
  var sales, cogs, sga, interest, gross, op, net, tries = 0;
  var prof = pick(IS_PROFILES);
  do {
    sales = rnd(6000, 120000, 1);
    cogs = Math.round(sales * (rnd(prof.cogs[0], prof.cogs[1], 1) / 100));
    sga = Math.round(sales * (rnd(prof.sga[0], prof.sga[1], 1) / 100));
    interest = rnd(20, Math.max(40, Math.round(sales * 0.02)), 1);
    gross = sales - cogs;
    op = gross - sga;
    net = op - interest;
    tries++;
  } while ((net === 0 || net > sales * 0.3 || net < -sales * 0.09) && tries < 500);

  var facts = hideCogs
    ? [["Net sales", sales], ["Gross profit", gross], ["Selling, general, administrative expenses", sga], ["Interest expense", interest]]
    : [["Net sales", sales], ["Cost of goods sold", cogs], ["Selling, general, administrative expenses", sga], ["Interest expense", interest]];

  var biz = pick(BANK.biz);
  return {
    company: biz.n,
    descr: biz.d,
    profile: prof.d,
    unit: pick(BANK.units),
    date: pick(BANK.dates),
    hideCogs: !!hideCogs,
    facts: shuffle(facts),
    keys: { sales: sales, cogs: cogs, sga: sga, interest: interest, gross: gross, op: op, net: net }
  };
}

        li.className = "lbl-input";
        li.placeholder = "Account name";

        lblFields[r.key] = li;
      }
      var ai = document.createElement("input");
      ai.type = "text";
      ai.className = "amt-input";
      ai.inputMode = "numeric";
      ai.placeholder = "0";
      ai.autocomplete = "off";
      ai.addEventListener("input", recalc);
      tdA.appendChild(ai);

  function recalc() {
    var gross = val("sales") - val("cogs");
    var op = gross - val("sga");
    var net = op - val("interest");
    calcCells.gross.textContent = any(["sales", "cogs"]) ? fmt(gross) : "\u2014";
    calcCells.op.textContent = any(["sales", "cogs", "sga"]) ? fmt(op) : "\u2014";
    calcCells.net.textContent = any(["sales", "cogs", "sga", "interest"]) ? fmt(net) : "\u2014";

      af.classList.add(amtOk ? "right" : "wrong");
      if (amtOk) right++;

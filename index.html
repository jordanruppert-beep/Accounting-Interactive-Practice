      '<p class="review-explain">' +
      "Interest expense sits below operating income because it is a nonoperating item, tied to how the company is financed rather than to selling the product. That is why operating income and net income are different numbers.</p></div>"));
    wrap.appendChild(key);
    scrollTop();
  });
  var newNums = h('<button type="button" class="link-btn">New numbers</button>');
  newNums.addEventListener("click", function () { startIncome(mode); });
  sb.appendChild(scoreLbl);
  sb.appendChild(checkBtn);
  wrap.appendChild(sb);
  var nav = h('<div class="nav-row"></div>');
  nav.appendChild(newNums);
  wrap.appendChild(nav);
  render(wrap);
}


/* ---------- statement of cash flows builder ---------- */
var CF_ROWS = [
  { t: "in", key: "ops", label: "Net cash flows from operations", alias: ["net cash flows from operations", "net cash flow from operations", "cash flows from operations", "cash flow from operations", "net cash from operations", "cash from operations", "operating activities", "net cash flows from operating activities", "operations"] },
  { t: "in", key: "inv", label: "Net cash flows from investing", alias: ["net cash flows from investing", "net cash flow from investing", "cash flows from investing", "cash flow from investing", "net cash from investing", "cash from investing", "investing activities", "net cash flows from investing activities", "investing"] },
  { t: "in", key: "fin", label: "Net cash flows from financing", alias: ["net cash flows from financing", "net cash flow from financing", "cash flows from financing", "cash flow from financing", "net cash from financing", "cash from financing", "financing activities", "net cash flows from financing activities", "financing"] },
  { t: "in", key: "fx", label: "Effect of exchange rates on cash", alias: ["effect of exchange rates on cash", "effect of exchange rates", "effect of exchange rate changes on cash", "exchange rate effect", "effect of foreign exchange rates on cash", "foreign exchange effect", "exchange rates"] },
  { t: "calc", calc: "change", text: "Net change in cash", cls: "total" },
  { t: "in", key: "begin", label: "Cash, beginning year", alias: ["cash beginning year", "cash beginning of year", "cash at beginning of year", "beginning cash", "cash beginning", "beginning cash balance"] },
  { t: "calc", calc: "end", text: "Cash, ending year", cls: "grand" }
];

var CF_LABEL_POOL = [
  "Net cash flows from operations", "Net cash flows from investing", "Net cash flows from financing",
  "Effect of exchange rates on cash", "Cash, beginning year", "Net change in cash", "Cash, ending year",
  "Net income", "Gross profit", "Retained earnings", "Total assets", "Accounts payable"
];

var CF_PROFILES = [
  { d: "a year of heavy expansion, funded partly by new borrowing", ops: [1200, 9000], inv: [3000, 9000], finSign: 1, fin: [1000, 5000] },
  { d: "a year spent paying down debt and buying back stock", ops: [2500, 11000], inv: [300, 3000], finSign: -1, fin: [1500, 6500] },
  { d: "a tight year where operations barely generated cash", ops: [-1500, 900], inv: [200, 2000], finSign: 1, fin: [500, 3500] },
  { d: "a steady year with routine equipment replacement", ops: [1500, 7000], inv: [800, 4000], finSign: -1, fin: [400, 2500] }
];

function makeCashFlow() {
  var ops, inv, fin, fx, begin, change, end, tries = 0;
  var prof = pick(CF_PROFILES);
  do {
    ops = rnd(prof.ops[0], prof.ops[1], 1);
    inv = -rnd(prof.inv[0], prof.inv[1], 1);
    fin = prof.finSign * rnd(prof.fin[0], prof.fin[1], 1);
    fx = Math.random() < 0.5 ? -rnd(5, 320, 1) : rnd(5, 320, 1);
    begin = rnd(250, 7000, 1);
    change = ops + inv + fin + fx;
    end = begin + change;
    tries++;
  } while ((end < 60 || Math.abs(change) < 40) && tries < 600);

  var biz = pick(BANK.biz);
  return {
    company: biz.n,
    descr: biz.d,
    profile: prof.d,
    unit: pick(BANK.units),
    date: pick(BANK.dates),
    facts: shuffle([
      ["Net cash flows from operations", ops],
      ["Net cash flows from investing", inv],
      ["Net cash flows from financing", fin],
      ["Effect of exchange rates on cash", fx],
      ["Cash, beginning year", begin]
    ]),
    keys: { ops: ops, inv: inv, fin: fin, fx: fx, begin: begin, change: change, end: end }
  };
}

/* ---------- debit and credit rules drill ---------- */
var DRCR_ROWS = [
  { type: "Assets", inc: "Debit", dec: "Credit",
    e: "Assets have a normal debit balance, so a debit increases them and a credit decreases them. Cash going up is always a debit to Cash." },
  { type: "Liabilities", inc: "Credit", dec: "Debit",
    e: "Liabilities sit on the other side of the accounting equation from assets, so they work the opposite way. Borrowing money credits the liability; paying it off debits it." },
  { type: "Equity", inc: "Credit", dec: "Debit",
    e: "Equity has a normal credit balance, same as liabilities, because both are claims on assets. Issuing stock credits equity; a dividend debits retained earnings." },
  { type: "Revenues", inc: "Credit", dec: "Debit",
    e: "Revenues increase equity, so they follow the equity rule: a credit increases revenue. This is why a sale credits Sales Revenue and debits Cash or Accounts Receivable." },
  { type: "Expenses", inc: "Debit", dec: "Credit",
    e: "Expenses reduce equity, so they behave opposite to equity: a debit increases an expense. Paying wages debits Wages Expense and credits Cash." }
];

function startDrCr(mode) {
  var rows = shuffle(DRCR_ROWS);
  var wrap = document.createElement("div");
  var bar = h('<div class="topbar"></div>');

  wrap.appendChild(h('<div class="intro-card"><p class="intro-kicker">Debits and credits</p>' +
    '<p class="intro-text">Debit just means the left side of an account and credit means the right side. Neither one means good or bad, and in every journal entry the two have to be equal. ' +
    "For each account type below, pick whether an increase and a decrease is recorded as a debit or a credit.</p></div>"));

  var card = h('<div class="exam-card"></div>');
  var table = h('<table class="drill-table"><thead><tr><th>Account type</th><th>If it increases</th><th>If it decreases</th></tr></thead><tbody></tbody></table>');

      sel.innerHTML = '<option value="">Pick one</option><option value="Debit">Debit</option><option value="Credit">Credit</option>';
      td.appendChild(sel);
      tr.appendChild(td);
      made.push({ sel: sel, answer: r[which] });
    });
    tr.insertBefore(td0, tr.firstChild);
    var noteTr = document.createElement("tr");
    var noteTd = document.createElement("td");
    noteTd.colSpan = 3;
    noteTd.style.paddingTop = "0";
    var note = h('<p class="row-note" hidden></p>');
    noteTd.appendChild(note);
    noteTr.appendChild(noteTd);
    tbody.appendChild(tr);
    tbody.appendChild(noteTr);
    cells.push({ row: r, boxes: made, note: note });
  });
  card.appendChild(table);
  wrap.appendChild(card);

  var sb = h('<div class="start-bar" style="margin-top:26px"></div>');
  var scoreLbl = h('<div class="topbar-label"></div>');
  var checkBtn = h('<button type="button" class="stamp-btn"><span>Check answers</span></button>');
  checkBtn.addEventListener("click", function () {
    var right = 0;
    cells.forEach(function (c) {
      var allRight = true;
      c.boxes.forEach(function (b) {
        var ok = b.sel.value === b.answer;
        b.sel.classList.remove("right", "wrong");
        b.sel.classList.add(ok ? "right" : "wrong");
        if (ok) right++; else allRight = false;
      });
      c.note.hidden = false;
      c.note.className = "row-note" + (allRight ? "" : " wrong");
      c.note.textContent = (allRight ? "" : "Increase = " + c.row.inc + ", decrease = " + c.row.dec + ". ") + c.row.e;
    });
    scoreLbl.textContent = right + " of 10 correct";
  });
  var reshuffle = h('<button type="button" class="link-btn">Shuffle and retry</button>');
  reshuffle.addEventListener("click", function () { startDrCr(mode); });
  sb.appendChild(scoreLbl);
  sb.appendChild(checkBtn);
  wrap.appendChild(sb);
  var nav = h('<div class="nav-row"></div>');
  nav.appendChild(reshuffle);
  wrap.appendChild(nav);

}


/* ---------- classifying items in financial statements ---------- */
var CLASSIFY = {
  options: ["B", "I", "SE", "B, I", "B, SE", "I, SE"],
  multi: [
    { label: "Common stock", ans: "B, SE", e: "The ending balance sits in the equity section of the balance sheet, and the statement of stockholders' equity shows how that balance changed during the year." },
    { label: "Retained earnings (year end balance)", ans: "B, SE", e: "Retained earnings is an equity balance on the balance sheet, and the statement of stockholders' equity is where you see beginning balance plus net income minus dividends get you there." },
    { label: "Net income", ans: "I, SE", e: "Net income is the bottom line of the income statement, and it then shows up as the addition to retained earnings on the statement of stockholders' equity. This is the link between the two statements." },
    { label: "Total stockholders' equity", ans: "B, SE", e: "It is a balance sheet total and also the ending total on the statement of stockholders' equity." }
  ],
  b: [
    { label: "Cash (year end balance)", e: "Cash is an asset, and assets are balance sheet items. Any account you can state a balance for at a point in time belongs on the balance sheet." },
    { label: "Accounts payable", e: "Amounts owed to suppliers are a liability, so this is a balance sheet item." },
    { label: "Inventory", e: "Unsold inventory is a current asset. Its cost only reaches the income statement as cost of goods sold once the goods are sold." },
    { label: "Equipment", e: "Equipment is a long-term asset. Only the depreciation of it hits the income statement." },
    { label: "Accounts receivable", e: "Amounts customers owe you are an asset, so this is a balance sheet item." },
    { label: "Prepaid insurance", e: "Paying in advance buys a future benefit, which makes it an asset until it is used up." },
    { label: "Notes payable", e: "A note payable is an obligation to a lender, so it is a liability on the balance sheet." },
    { label: "Unearned revenue", e: "Despite the word revenue, cash collected before delivery is a liability, not income. It is a balance sheet item." },
    { label: "Land", e: "Land is a long-term asset reported on the balance sheet." },
    { label: "Wages payable", e: "Wages employees have earned but not yet been paid is a liability, so it is a balance sheet item. The wages expense itself is on the income statement." },
    { label: "Long-term debt", e: "Debt not due within a year is a noncurrent liability on the balance sheet." },
    { label: "Supplies on hand", e: "Supplies not yet used are an asset. They become supplies expense as they get consumed." }
  ],
  i: [
    { label: "Advertising expense", e: "Expenses are income statement items. They measure resources consumed during the period, not balances held at a point in time." },
    { label: "Printing fees earned", e: "Fees earned is revenue, which belongs on the income statement." },
    { label: "Wages expense", e: "An expense of the period, so it goes on the income statement. Any unpaid portion becomes an accrued liability on the balance sheet." },
    { label: "Rent expense", e: "Rent used up during the period is an income statement expense." },
    { label: "Sales revenue", e: "Revenue earned during the period is the top line of the income statement." },
    { label: "Cost of goods sold", e: "The cost of inventory that was actually sold becomes an income statement expense, matched against the revenue it generated." },
    { label: "Interest expense", e: "Interest is an expense of the period. It sits below operating income because it is nonoperating." },
    { label: "Utilities expense", e: "A period expense on the income statement." },
    { label: "Service fees earned", e: "Fees earned for services delivered is revenue, so it belongs on the income statement." },
    { label: "Depreciation expense", e: "Depreciation is the portion of a long-term asset's cost used up this period, so it is an income statement expense." },
    { label: "Interest revenue", e: "Interest earned is revenue on the income statement, reported as a nonoperating item." }
  ],
  se: [
    { label: "Dividends", e: "Dividends are a distribution of profit to owners, not an expense, so they never touch the income statement. They appear on the statement of stockholders' equity as a reduction of retained earnings." },
    { label: "Dividends declared during the year", e: "A dividend reduces retained earnings and shows up on the statement of stockholders' equity. It is not an expense, so it stays off the income statement." }
  ]
};

function makeClassify() {
  var multi = pick(CLASSIFY.multi);
  var se = pick(CLASSIFY.se);
  var nb = rnd(3, 4);
  var bItems = shuffle(CLASSIFY.b).slice(0, nb).map(function (x) { return { label: x.label, ans: "B", e: x.e }; });
  var iItems = shuffle(CLASSIFY.i).slice(0, 7 - nb - 1).map(function (x) { return { label: x.label, ans: "I", e: x.e }; });
  var items = [{ label: multi.label, ans: multi.ans, e: multi.e }, { label: se.label, ans: "SE", e: se.e }]
    .concat(bItems).concat(iItems);
  return shuffle(items);
}

function startClassify(mode) {
  var items = makeClassify();
  var wrap = document.createElement("div");

  bar.appendChild(h('<div class="topbar-label">8 items</div>'));

  wrap.appendChild(h('<div class="intro-card"><p class="intro-kicker">Where does it get reported</p>' +
    '<p class="intro-text">For each item, pick whether it would most likely be reported on the balance sheet (B), the income statement (I), and/or the statement of stockholders\' equity (SE). ' +
    "Exactly one item on this list is reported on more than one statement, so for that one pick the option naming both. New items every attempt.</p></div>"));

  var card = h('<div class="exam-card"></div>');
  var table = h('<table class="drill-table"><thead><tr><th>Item</th><th>Statement</th></tr></thead><tbody></tbody></table>');
  var tbody = table.querySelector("tbody");
  var cells = [];
  items.forEach(function (it, i) {
    var tr = document.createElement("tr");
    var td1 = document.createElement("td");
    td1.textContent = String.fromCharCode(97 + i) + ". " + it.label;
    var td2 = document.createElement("td");
    var sel = document.createElement("select");
    sel.className = "drill-select narrow";
    sel.innerHTML = '<option value="">Pick one</option>' + CLASSIFY.options.map(function (o) {
      return '<option value="' + o + '">' + o + "</option>";
    }).join("");
    var note = h('<p class="row-note" hidden></p>');
    td2.appendChild(sel);
    td2.appendChild(note);
    tr.appendChild(td1);
    tr.appendChild(td2);
    tbody.appendChild(tr);
    cells.push({ sel: sel, note: note, item: it });
  });
  card.appendChild(table);
  wrap.appendChild(card);

  var sb = h('<div class="start-bar" style="margin-top:26px"></div>');
  var scoreLbl = h('<div class="topbar-label"></div>');
  var checkBtn = h('<button type="button" class="stamp-btn"><span>Check answers</span></button>');
  checkBtn.addEventListener("click", function () {
    var right = 0;
    cells.forEach(function (c) {
      var ok = c.sel.value === c.item.ans;
      c.sel.classList.remove("right", "wrong");
      c.sel.classList.add(ok ? "right" : "wrong");
      c.note.hidden = false;
      c.note.className = "row-note" + (ok ? "" : " wrong");
      c.note.textContent = (ok ? "" : c.item.ans + ". ") + c.item.e;
      if (ok) right++;
    });
    scoreLbl.textContent = right + " of " + cells.length + " correct";
  });
  var again = h('<button type="button" class="link-btn">New items</button>');
  again.addEventListener("click", function () { startClassify(mode); });
  sb.appendChild(scoreLbl);
  sb.appendChild(checkBtn);
  wrap.appendChild(sb);
  var nav = h('<div class="nav-row"></div>');
  nav.appendChild(again);
  wrap.appendChild(nav);
  render(wrap);
}


/* ---------- journal entry practice ---------- */
var JE_ACCOUNTS = {

  cogs: { label: "Cost of goods sold", alias: ["cost of goods sold", "cogs", "cost of sales"] },
  equip: { label: "Equipment", alias: ["equipment"] },

  re: { label: "Retained earnings", alias: ["retained earnings"] },

  prepaid: { label: "Prepaid insurance", alias: ["prepaid insurance", "prepaid expense", "prepaid expenses", "prepaids", "prepaid"] },
  unearned: { label: "Unearned revenue", alias: ["unearned revenue", "deferred revenue", "unearned revenues"] },
  land: { label: "Land", alias: ["land"] }
};

var JE_DISTRACTORS = ["Dividends", "Interest expense", "Utilities expense", "Gross profit", "Net income", "Total assets"];

// three different companies with three different transaction sets

        { text: "Sell inventory for $" + fmt(n.sale) + " on credit.", dr: A.ar, cr: A.sales, amt: n.sale, memo: "To record sale of inventory." },

        { text: "Acquire $" + fmt(n.equip) + " of equipment by signing a note.", dr: A.equip, cr: A.np, amt: n.equip, memo: "To record acquisition of equipment." },
        { text: "Pay wages of $" + fmt(n.wages) + " in cash.", dr: A.wages, cr: A.cash, amt: n.wages, memo: "To record wage payment." },
        { text: "Pay $" + fmt(n.equip) + " on a note payable that came due.", dr: A.np, cr: A.cash, amt: n.equip, memo: "To record payment of note payable." },
        { text: "Pay $" + fmt(n.div) + " cash dividend.", dr: A.re, cr: A.cash, amt: n.div, memo: "To record payment of cash dividend." }
      ];
    }
  },
  {
    name: "service company",
    build: function () {
      var A = JE_ACCOUNTS, n = {}, tries = 0;
      do {
        n.stock = rnd(6, 24, 1) * 5000;
        n.loan = rnd(4, 24, 1) * 500;
        n.supplies = rnd(2, 14, 1) * 500;

        { text: "Borrow $" + fmt(n.loan) + " from a bank by signing a note.", dr: A.cash, cr: A.np, amt: n.loan, memo: "To record bank borrowing." },
        { text: "Purchase $" + fmt(n.supplies) + " of supplies on credit.", dr: A.supplies, cr: A.ap, amt: n.supplies, memo: "To record purchase of supplies." },
        { text: "Pay the supplier the $" + fmt(n.supplies) + " owed from transaction 3.", dr: A.ap, cr: A.cash, amt: n.supplies, memo: "To record payment on account." },
        { text: "Perform services and bill customers $" + fmt(n.billed) + ".", dr: A.ar, cr: A.svc, amt: n.billed, memo: "To record services performed on account." },
        { text: "Collect $" + fmt(n.collected) + " of the amount billed in transaction 5.", dr: A.cash, cr: A.ar, amt: n.collected, memo: "To record cash collection." },
        { text: "Pay rent of $" + fmt(n.rent) + " in cash.", dr: A.rent, cr: A.cash, amt: n.rent, memo: "To record rent payment." },
        { text: "Pay wages of $" + fmt(n.wages) + " in cash.", dr: A.wages, cr: A.cash, amt: n.wages, memo: "To record wage payment." },
        { text: "Pay a $" + fmt(n.div) + " cash dividend to shareholders.", dr: A.re, cr: A.cash, amt: n.div, memo: "To record payment of cash dividend." }
      ];

  },

      var A = JE_ACCOUNTS, n = {}, tries = 0;

        n.cash = n.stock - n.insurance + n.sale + n.deposit - n.inv - n.wages - n.land;

      } while ((n.sale <= n.inv || n.cash < 4000) && tries < 400);

        { text: "Purchase $" + fmt(n.inv) + " of inventory on credit.", dr: A.inv, cr: A.ap, amt: n.inv, memo: "To record purchase of inventory." },
        { text: "Sell inventory for $" + fmt(n.sale) + " cash.", dr: A.cash, cr: A.sales, amt: n.sale, memo: "To record cash sale." },
        { text: "Record $" + fmt(n.inv) + " for the cost of the inventory sold in transaction 4.", dr: A.cogs, cr: A.inv, amt: n.inv, memo: "To record cost of inventory sold." },
        { text: "Receive $" + fmt(n.deposit) + " cash from a customer for goods to be delivered next year.", dr: A.cash, cr: A.unearned, amt: n.deposit, memo: "To record customer deposit." },
        { text: "Pay the $" + fmt(n.inv) + " owed to suppliers from transaction 3.", dr: A.ap, cr: A.cash, amt: n.inv, memo: "To record payment on account." },
        { text: "Pay wages of $" + fmt(n.wages) + " in cash.", dr: A.wages, cr: A.cash, amt: n.wages, memo: "To record wage payment." },
        { text: "Purchase land for $" + fmt(n.land) + " cash.", dr: A.land, cr: A.cash, amt: n.land, memo: "To record purchase of land." }
      ];
    }
  }
];

function makeJournal() {
  var tpl = pick(JE_TEMPLATES);
  var entries = tpl.build();
  var biz = pick(BANK.biz);
  return {
    company: biz.n,
    descr: biz.d,
    template: tpl.name,
    entries: entries,
    totals: entries.reduce(function (t, e) { return t + e.amt; }, 0)
  };
}

function startJournal(mode) {
  var isDrop = mode.variant === "dropdown";
  var prob = makeJournal();
  var wrap = document.createElement("div");

  var bar = h('<div class="topbar"></div>');
  bar.appendChild(homeLink());
  bar.appendChild(h('<div class="topbar-label">' + prob.entries.length + " entries</div>"));
  wrap.appendChild(bar);

  var txns = prob.entries.map(function (e) { return "<li>" + escapeHtml(e.text) + "</li>"; }).join("");
  wrap.appendChild(h('<div class="stmt-prompt"><h3>' + escapeHtml(prob.company) + "</h3>" +
    '<p class="ask" style="margin-top:0;margin-bottom:11px">' + escapeHtml(prob.descr.charAt(0).toUpperCase() + prob.descr.slice(1)) +
    ", entered into the following transactions. Record each one in the general journal below.</p>" +
    '<ol class="txn-list">' + txns + "</ol>" +
    '<p class="ask">Debit line first, credit line indented underneath' + (isDrop ? " (pick each account from the dropdown)" : " (type each account name yourself)") +
    ". Put each amount in the correct column and leave the other column blank. Total debits and total credits at the bottom update as you type.</p></div>"));

  // the dropdown offers the accounts this company actually uses, plus a few wrong turns
  var used = [];
  prob.entries.forEach(function (e) {
    [e.dr.label, e.cr.label].forEach(function (l) { if (used.indexOf(l) === -1) used.push(l); });
  });
  var labelPool = used.concat(shuffle(JE_DISTRACTORS).slice(0, 4));
  var allAliases = [];
  prob.entries.forEach(function (e) {
    [e.dr, e.cr].forEach(function (a) { if (allAliases.indexOf(a.alias) === -1) allAliases.push(a.alias); });
  });

  var card = h('<div class="exam-card" style="padding-top:18px"></div>');
  var table = h('<table class="je-table"><thead><tr><th>Ref</th><th>Description</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody></tbody></table>');
  var tbody = table.querySelector("tbody");
  var lines = [];

  function acctField() {
    if (isDrop) {
      var sel = document.createElement("select");
      sel.className = "je-acct-field";
      sel.innerHTML = '<option value="">Select account</option>' + shuffle(labelPool).map(function (o) {
        return '<option value="' + escapeHtml(o) + '">' + escapeHtml(o) + "</option>";
      }).join("");
      return sel;
    }
    var inp = document.createElement("input");
    inp.type = "text";
    inp.className = "je-acct-field";
    inp.placeholder = "Account name";
    inp.autocomplete = "off";
    inp.spellcheck = false;
    return inp;
  }
  function amtField() {
    var inp = document.createElement("input");
    inp.type = "text";
    inp.className = "je-input";
    inp.autocomplete = "off";
    inp.addEventListener("input", recalc);
    return inp;
  }

  prob.entries.forEach(function (e, i) {
    ["dr", "cr"].forEach(function (side) {
      var tr = document.createElement("tr");
      if (side === "cr") tr.className = "cr-line";
      var tdRef = document.createElement("td");
      tdRef.className = "je-ref";
      if (side === "dr") tdRef.textContent = "(" + (i + 1) + ")";
      var tdAcct = document.createElement("td");
      tdAcct.className = "je-acct";
      var af = acctField();
      tdAcct.appendChild(af);
      var tdDr = document.createElement("td");
      tdDr.className = "je-num";
      var dIn = amtField();
      tdDr.appendChild(dIn);
      var tdCr = document.createElement("td");
      tdCr.className = "je-num";
      var cIn = amtField();
      tdCr.appendChild(cIn);
      tr.appendChild(tdRef); tr.appendChild(tdAcct); tr.appendChild(tdDr); tr.appendChild(tdCr);
      tbody.appendChild(tr);
      lines.push({ entry: e, side: side, acct: af, dr: dIn, cr: cIn });
    });
    var memoTr = document.createElement("tr");
    memoTr.className = "memo-row";
    var pad = document.createElement("td");
    var memoTd = document.createElement("td");
    memoTd.colSpan = 3;
    memoTd.innerHTML = '<span class="je-memo">' + escapeHtml(e.memo) + "</span>";
    memoTr.appendChild(pad); memoTr.appendChild(memoTd);
    tbody.appendChild(memoTr);
  });
  card.appendChild(table);
  var totals = h('<div class="je-totals"><div>Total debits <span id="td-val">0</span></div><div>Total credits <span id="tc-val">0</span></div></div>');
  card.appendChild(totals);
  var tieNote = h('<p class="tie-note" hidden></p>');
  card.appendChild(tieNote);
  wrap.appendChild(card);

  function num(inp) { var v = parseAmt(inp.value); return isNaN(v) ? 0 : v; }
  function recalc() {
    var td = 0, tc = 0, any = false;
    lines.forEach(function (l) {
      td += num(l.dr); tc += num(l.cr);
      if (l.dr.value.trim() !== "" || l.cr.value.trim() !== "") any = true;
    });
    totals.querySelector("#td-val").textContent = fmt(td);
    totals.querySelector("#tc-val").textContent = fmt(tc);
    if (!any) { tieNote.hidden = true; return; }
    tieNote.hidden = false;
    if (td === tc) {
      tieNote.className = "tie-note ok";
      tieNote.textContent = "Debits equal credits at " + fmt(td) + ". That has to be true in every journal entry and in the journal as a whole.";
    } else {
      tieNote.className = "tie-note bad";
      tieNote.textContent = "Debits and credits do not agree: " + fmt(td) + " versus " + fmt(tc) + ", off by " + fmt(Math.abs(td - tc)) + ".";
    }
  }

  var sb = h('<div class="start-bar" style="margin-top:26px"></div>');
  var scoreLbl = h('<div class="topbar-label"></div>');
  var checkBtn = h('<button type="button" class="stamp-btn"><span>Check my work</span></button>');
  checkBtn.addEventListener("click", function () {
    var right = 0, total = 0;
    lines.forEach(function (l) {
      var target = l.side === "dr" ? l.entry.dr : l.entry.cr;
      total += 2;
      var others = allAliases.filter(function (a) { return a !== target.alias; });
      var acctOk = isDrop ? (l.acct.value === target.label) : matchExclusive(l.acct.value, target.alias, others);
      l.acct.classList.remove("right", "wrong");
      l.acct.classList.add(acctOk ? "right" : "wrong");
      if (acctOk) right++;
      var filled = l.side === "dr" ? l.dr : l.cr;
      var empty = l.side === "dr" ? l.cr : l.dr;
      var emptyOk = empty.value.trim() === "" || parseAmt(empty.value) === 0;
      var amtOk = parseAmt(filled.value) === l.entry.amt && emptyOk;
      [l.dr, l.cr].forEach(function (f) { f.classList.remove("right", "wrong"); f.classList.add(amtOk ? "right" : "wrong"); });
      if (amtOk) right++;
    });
    scoreLbl.textContent = right + " of " + total + " boxes correct";

    var existing = wrap.querySelector(".review");
    if (existing) existing.remove();
    var key = h('<div class="review" style="margin-top:26px"></div>');
    key.appendChild(h('<h3 class="review-heading">Answer key</h3>'));
    var rowsHtml = prob.entries.map(function (e, i) {
      return '<p class="review-correct">(' + (i + 1) + ") Dr " + escapeHtml(e.dr.label) + " " + fmt(e.amt) + ", Cr " + escapeHtml(e.cr.label) + " " + fmt(e.amt) + "</p>";
    }).join("");
    key.appendChild(h('<div class="review-item">' + rowsHtml +
      '<p class="review-explain">Watch the transactions that reuse an earlier amount: paying off what you owe, collecting what you billed, or recording the cost of what you sold is never an independent number. ' +
      "The dividend debits Retained earnings, not a Dividends account, because that is how your slides record it, and a dividend is a distribution to owners rather than an expense. " +
      "Debits total " + fmt(prob.totals) + " and credits total the same, which is the fastest check that you have not flipped a column somewhere.</p></div>"));
    wrap.appendChild(key);
    scrollTop();
  });
  var newNums = h('<button type="button" class="link-btn">New problem</button>');
  newNums.addEventListener("click", function () { startJournal(mode); });
  sb.appendChild(scoreLbl);
  sb.appendChild(checkBtn);
  wrap.appendChild(sb);
  var nav = h('<div class="nav-row"></div>');
  nav.appendChild(newNums);
  wrap.appendChild(nav);
  render(wrap);
}

function makeTransactions() {
  var tpl = pick(TX_TEMPLATES);
  var p = tpl.build();
  p.company = pick(tpl.names);
  p.descr = tpl.descr;
  p.template = tpl.id;
  p.date = pick(BANK.dates);
  return p;
}

function startTransactions(mode) {
  var isDrop = mode.variant === "dropdown";
  var prob = makeTransactions();
  var wrap = document.createElement("div");

  var bar = h('<div class="topbar"></div>');
  bar.appendChild(homeLink());
  bar.appendChild(h('<div class="topbar-label">' + (isDrop ? "Dropdown account names" : "Everything blank") + "</div>"));
  wrap.appendChild(bar);

  wrap.appendChild(h('<div class="stmt-prompt"><h3>' + escapeHtml(prob.company) + "</h3>" +
    '<p class="ask" style="margin-top:0;margin-bottom:11px">' + escapeHtml(prob.descr.charAt(0).toUpperCase() + prob.descr.slice(1)) +
    ", entered into the following transactions during the first year of its operations:</p>" +
    '<ol class="txn-list">' + prob.txns.map(function (t) { return "<li>" + escapeHtml(t) + "</li>"; }).join("") + "</ol>" +
    '<p class="ask">Journalize each transaction, then prepare the income statement and the year-end balance sheet. ' +
    "Do the income statement before the balance sheet: retained earnings needs net income, and since this is the company's first year, retained earnings starts at zero.</p></div>"));

  // every account that appears anywhere in this problem, for the dropdown and for typo checking
  var used = [], allAliases = [];
  prob.entries.forEach(function (e) {
    e.lines.forEach(function (l) {
      if (used.indexOf(l.a.label) === -1) { used.push(l.a.label); allAliases.push(l.a.alias); }
    });
  });
  var labelPool = used.concat(shuffle(TX_DISTRACTORS).slice(0, 4));

  /* ---- step 1: journal ---- */
  var jeCard = h('<div class="exam-card" style="padding-top:18px;margin-bottom:26px"></div>');
  jeCard.appendChild(h('<p class="step-label">Step 1: Journalize each transaction <span>Debits first, credits indented. Amount in one column, other column blank.</span></p>'));
  var jeTable = h('<table class="je-table"><thead><tr><th>Ref</th><th>Description</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody></tbody></table>');
  var jeBody = jeTable.querySelector("tbody");
  var jeLines = [];

  function acctField(cls) {
    if (isDrop) {
      var sel = document.createElement("select");
      sel.className = cls;
      sel.innerHTML = '<option value="">Select account</option>' + shuffle(labelPool).map(function (o) {
        return '<option value="' + escapeHtml(o) + '">' + escapeHtml(o) + "</option>";
      }).join("");
      return sel;
    }
    var inp = document.createElement("input");
    inp.type = "text";
    inp.className = cls;
    inp.placeholder = "Account name";
    inp.autocomplete = "off";
    inp.spellcheck = false;
    return inp;
  }

  prob.entries.forEach(function (e, i) {
    e.lines.forEach(function (l, li) {
      var tr = document.createElement("tr");
      if (l.s === "cr") tr.className = "cr-line";
      var tdRef = document.createElement("td");
      tdRef.className = "je-ref";
      if (li === 0) tdRef.textContent = "(" + (i + 1) + ")";
      var tdAcct = document.createElement("td");
      tdAcct.className = "je-acct";
      var af = acctField("je-acct-field");
      tdAcct.appendChild(af);
      var mk = function () {
        var inp = document.createElement("input");
        inp.type = "text";
        inp.className = "je-input";
        inp.autocomplete = "off";
        inp.addEventListener("input", recalcJournal);
        return inp;
      };
      var tdDr = document.createElement("td");
      tdDr.className = "je-num";
      var dIn = mk();
      tdDr.appendChild(dIn);
      var tdCr = document.createElement("td");
      tdCr.className = "je-num";
      var cIn = mk();
      tdCr.appendChild(cIn);
      tr.appendChild(tdRef); tr.appendChild(tdAcct); tr.appendChild(tdDr); tr.appendChild(tdCr);
      jeBody.appendChild(tr);
      jeLines.push({ entry: i, acct: af, dr: dIn, cr: cIn });
    });
    var memoTr = document.createElement("tr");
    memoTr.className = "memo-row";
    var pad = document.createElement("td");
    var memoTd = document.createElement("td");
    memoTd.colSpan = 3;
    memoTd.innerHTML = '<span class="je-memo">' + escapeHtml(e.memo) + "</span>";
    memoTr.appendChild(pad); memoTr.appendChild(memoTd);
    jeBody.appendChild(memoTr);

  jeCard.appendChild(jeTable);
  var jeTotals = h('<div class="je-totals"><div>Total debits <span id="jtd">0</span></div><div>Total credits <span id="jtc">0</span></div></div>');
  jeCard.appendChild(jeTotals);
  var jeNote = h('<p class="tie-note" hidden></p>');
  jeCard.appendChild(jeNote);
  wrap.appendChild(jeCard);

  function recalcJournal() {
    var td = 0, tc = 0, any = false;
    jeLines.forEach(function (l) {
      var d = parseAmt(l.dr.value), c = parseAmt(l.cr.value);
      if (!isNaN(d)) td += d;
      if (!isNaN(c)) tc += c;
      if (l.dr.value.trim() !== "" || l.cr.value.trim() !== "") any = true;
    });
    jeTotals.querySelector("#jtd").textContent = fmt(td);
    jeTotals.querySelector("#jtc").textContent = fmt(tc);
    if (!any) { jeNote.hidden = true; return; }
    jeNote.hidden = false;
    jeNote.className = "tie-note " + (td === tc ? "ok" : "bad");
    jeNote.textContent = td === tc
      ? "Debits equal credits at " + fmt(td) + "."
      : "Debits and credits do not agree: " + fmt(td) + " versus " + fmt(tc) + ", off by " + fmt(Math.abs(td - tc)) + ".";
  }

  /* ---- steps 2 and 3: the statements ---- */
  var groups = { rev: prob.is.rev, exp: prob.is.exp, asset: prob.bs.asset, liab: prob.bs.liab, eq: prob.bs.eq };
  var amtFields = {}, lblFields = {}, calcCells = {}, rowGroup = {};

  function buildTable(rows) {
    var table = h('<table class="stmt-table"><tbody></tbody></table>');
    var tbody = table.querySelector("tbody");
    rows.forEach(function (r) {

      if (r.cls) cls.push(r.cls);
      var tdL = document.createElement("td");
      tdL.className = "lbl";
      var tdA = document.createElement("td");
      tdA.className = "amt";
      if (r.t === "head") {

      } else if (r.t === "in") {
        var lf = acctField(isDrop ? "lbl-select" : "lbl-input");
        tdL.appendChild(lf);
        lblFields[r.key] = lf;
        var ai = document.createElement("input");
        ai.type = "text";
        ai.className = "amt-input";
        ai.placeholder = "0";
        ai.autocomplete = "off";
        ai.addEventListener("input", recalcStatements);
        tdA.appendChild(ai);
        amtFields[r.key] = ai;
        rowGroup[r.key] = r.grp;
      } else {
        tdL.textContent = r.text;
        tdA.className = "amt calc-cell";
        tdA.textContent = "\u2014";
        calcCells[r.calc] = tdA;
      }
      tr.className = cls.join(" ");
      tr.appendChild(tdL);
      tr.appendChild(tdA);
      tbody.appendChild(tr);
    });
    return table;
  }

  var isRows = [{ t: "in", key: "rev", grp: "rev" }];
  prob.is.exp.forEach(function (_, i) { isRows.push({ t: "in", key: "e" + i, grp: "exp" }); });
  isRows.push({ t: "calc", calc: "ni", text: "Net income", cls: "grand" });

  var bsRows = [{ t: "head", text: "Assets" }];
  prob.bs.asset.forEach(function (_, i) { bsRows.push({ t: "in", key: "a" + i, grp: "asset", indent: true }); });
  bsRows.push({ t: "calc", calc: "ta", text: "Total assets", cls: "grand" });
  bsRows.push({ t: "head", text: "Liabilities and stockholders' equity" });
  prob.bs.liab.forEach(function (_, i) { bsRows.push({ t: "in", key: "l" + i, grp: "liab", indent: true }); });
  prob.bs.eq.forEach(function (_, i) { bsRows.push({ t: "in", key: "q" + i, grp: "eq", indent: true }); });
  bsRows.push({ t: "calc", calc: "tle", text: "Total liabilities and stockholders' equity", cls: "grand" });

  var isCard = h('<div class="exam-card" style="padding-top:18px;margin-bottom:26px"></div>');
  isCard.appendChild(h('<p class="step-label">Step 2: Income statement <span>Enter expenses as positive numbers; they get subtracted for you.</span></p>'));
  isCard.appendChild(h('<div class="stmt-head">' + escapeHtml(prob.company) + "<span>Income Statement</span><span>For the Year Ended " + escapeHtml(prob.date) + "</span></div>"));
  isCard.appendChild(buildTable(isRows));
  var niNote = h('<p class="tie-note" hidden></p>');
  isCard.appendChild(niNote);
  wrap.appendChild(isCard);

  var bsCard = h('<div class="exam-card" style="padding-top:18px"></div>');
  bsCard.appendChild(h('<p class="step-label">Step 3: Balance sheet <span>Retained earnings is net income less the dividend.</span></p>'));
  bsCard.appendChild(h('<div class="stmt-head">' + escapeHtml(prob.company) + "<span>Balance Sheet</span><span>" + escapeHtml(prob.date) + "</span></div>"));
  bsCard.appendChild(buildTable(bsRows));
  var tieNote = h('<p class="tie-note" hidden></p>');
  bsCard.appendChild(tieNote);
  wrap.appendChild(bsCard);

  function val(k) { var v = parseAmt(amtFields[k].value); return isNaN(v) ? 0 : v; }
  function keysOf(grp) { return Object.keys(rowGroup).filter(function (k) { return rowGroup[k] === grp; }); }
  function sumGrp(grp) { return keysOf(grp).reduce(function (t, k) { return t + val(k); }, 0); }
  function anyGrp(grps) { return grps.some(function (g) { return keysOf(g).some(function (k) { return amtFields[k].value.trim() !== ""; }); }); }

  function recalcStatements() {
    var ni = sumGrp("rev") - sumGrp("exp");
    var ta = sumGrp("asset");
    var tle = sumGrp("liab") + sumGrp("eq");
    calcCells.ni.textContent = anyGrp(["rev", "exp"]) ? fmt(ni) : "\u2014";
    calcCells.ta.textContent = anyGrp(["asset"]) ? fmt(ta) : "\u2014";
    calcCells.tle.textContent = anyGrp(["liab", "eq"]) ? fmt(tle) : "\u2014";
    if (anyGrp(["rev", "exp"])) {
      niNote.hidden = false;
      niNote.className = "tie-note " + (ni >= 0 ? "ok" : "bad");
      niNote.textContent = ni >= 0
        ? "Net income of " + fmt(ni) + ". Carry this into retained earnings below, less the dividend."
        : "That is a net loss of " + fmt(Math.abs(ni)) + ".";
    } else { niNote.hidden = true; }
    ["ta", "tle"].forEach(function (n) { calcCells[n].classList.remove("tie", "notie"); });
    if (anyGrp(["asset"]) && anyGrp(["liab", "eq"])) {
      var bal = ta === tle;
      ["ta", "tle"].forEach(function (n) { calcCells[n].classList.add(bal ? "tie" : "notie"); });
      tieNote.hidden = false;
      tieNote.className = "tie-note " + (bal ? "ok" : "bad");
      tieNote.textContent = bal
        ? "Balanced. Total assets equal total liabilities and stockholders' equity."
        : "Not balanced. Assets are " + fmt(ta) + " but liabilities plus equity come to " + fmt(tle) + ", off by " + fmt(Math.abs(ta - tle)) + ".";
    } else { tieNote.hidden = true; }
  }

  /* ---- grading ---- */
  var sb = h('<div class="start-bar" style="margin-top:26px"></div>');
  var scoreLbl = h('<div class="score-split"></div>');
  var checkBtn = h('<button type="button" class="stamp-btn"><span>Check my work</span></button>');

  function matchAccount(typed, target, competitors) {
    if (isDrop) return typed === target.label;
    return matchExclusive(typed, target.alias, competitors);
  }

  checkBtn.addEventListener("click", function () {
    // step 1: journal, matched as a set within each entry so swapping two debit lines is fine
    var jRight = 0, jTotal = 0;
    prob.entries.forEach(function (e, ei) {
      var rows = jeLines.filter(function (l) { return l.entry === ei; });
      var claimed = [];
      rows.forEach(function (l) {
        jTotal += 2;
        var hit = null, bestD = Infinity;
        for (var i = 0; i < e.lines.length; i++) {
          if (claimed.indexOf(i) !== -1) continue;
          var d;
          if (isDrop) d = (l.acct.value === e.lines[i].a.label) ? 0 : Infinity;
          else d = aliasDistance(l.acct.value, e.lines[i].a.alias);
          if (d < bestD) { bestD = d; hit = i; }
        }
        if (bestD === Infinity) hit = null;
        else if (!isDrop && bestD > 0) {
          var chosen = e.lines[hit].a;
          for (var q = 0; q < allAliases.length; q++) {
            if (allAliases[q] !== chosen.alias && aliasDistance(l.acct.value, allAliases[q]) < bestD) { hit = null; break; }
          }
        }
        var acctOk = hit !== null;
        if (acctOk) claimed.push(hit);
        l.acct.classList.remove("right", "wrong");
        l.acct.classList.add(acctOk ? "right" : "wrong");
        if (acctOk) jRight++;
        var amtOk = false;
        if (acctOk) {
          var exp = e.lines[hit];
          var filledBox = exp.s === "dr" ? l.dr : l.cr;
          var emptyBox = exp.s === "dr" ? l.cr : l.dr;
          var emptyOk = emptyBox.value.trim() === "" || parseAmt(emptyBox.value) === 0;
          amtOk = parseAmt(filledBox.value) === exp.v && emptyOk;
        }
        [l.dr, l.cr].forEach(function (f) { f.classList.remove("right", "wrong"); f.classList.add(amtOk ? "right" : "wrong"); });
        if (amtOk) jRight++;
      });
    });

    // steps 2 and 3: statements, matched as a set within each section
    var sRight = 0, sTotal = 0;
    var claimedBy = {};
    Object.keys(groups).forEach(function (g) { claimedBy[g] = []; });
    Object.keys(amtFields).forEach(function (k) {
      var g = rowGroup[k], pool = groups[g];
      sTotal += 2;
      var lf = lblFields[k], af = amtFields[k];
      var hit = null, bestD = Infinity;
      for (var i = 0; i < pool.length; i++) {
        if (claimedBy[g].indexOf(i) !== -1) continue;
        var d;
        if (isDrop) d = (lf.value === pool[i].a.label) ? 0 : Infinity;
        else d = aliasDistance(lf.value, pool[i].a.alias);
        if (d < bestD) { bestD = d; hit = i; }
      }
      if (bestD === Infinity) hit = null;
      else if (!isDrop && bestD > 0) {
        var chosen = pool[hit].a;
        for (var q = 0; q < allAliases.length; q++) {
          if (allAliases[q] !== chosen.alias && aliasDistance(lf.value, allAliases[q]) < bestD) { hit = null; break; }
        }
      }
      var lblOk = hit !== null;
      if (lblOk) claimedBy[g].push(hit);
      lf.classList.remove("right", "wrong");
      lf.classList.add(lblOk ? "right" : "wrong");
      if (lblOk) sRight++;
      var amtOk = lblOk && parseAmt(af.value) === pool[hit].v;
      af.classList.remove("right", "wrong");
      af.classList.add(amtOk ? "right" : "wrong");
      if (amtOk) sRight++;
    });

    scoreLbl.innerHTML = "Journal entries: <strong>" + jRight + " of " + jTotal + "</strong><br>Statements: <strong>" + sRight + " of " + sTotal + "</strong>";

    var n = prob.n;
    var existing = wrap.querySelector(".review");
    if (existing) existing.remove();
    var key = h('<div class="review" style="margin-top:26px"></div>');
    key.appendChild(h('<h3 class="review-heading">Answer key</h3>'));
    var jeKey = prob.entries.map(function (e, i) {
      var drs = e.lines.filter(function (l) { return l.s === "dr"; }).map(function (l) { return "Dr " + l.a.label + " " + fmt(l.v); });
      var crs = e.lines.filter(function (l) { return l.s === "cr"; }).map(function (l) { return "Cr " + l.a.label + " " + fmt(l.v); });
      return '<p class="review-correct">(' + (i + 1) + ") " + escapeHtml(drs.concat(crs).join(", ")) + "</p>";
    }).join("");
    var line = function (arr) { return arr.map(function (x) { return x.a.label + " " + fmt(x.v); }).join(", "); };
    key.appendChild(h('<div class="review-item">' + jeKey +
      '<p class="review-correct" style="margin-top:11px">Income statement: ' + escapeHtml(line(prob.is.rev)) + " less " + escapeHtml(line(prob.is.exp)) + ", net income " + fmt(n.ni) + "</p>" +
      '<p class="review-correct">Retained earnings: net income ' + fmt(n.ni) + " minus the dividend of " + fmt(n.div) + " equals " + fmt(n.re) + ", starting from zero in year one</p>" +
      '<p class="review-correct">Balance sheet assets: ' + escapeHtml(line(prob.bs.asset)) + "</p>" +
      '<p class="review-correct">Liabilities and equity: ' + escapeHtml(line(prob.bs.liab)) + ", " + escapeHtml(line(prob.bs.eq)) + "</p>" +
      '<p class="review-explain">' + prob.notes +
      " And the dividend of " + fmt(n.div) + " never touches the income statement: it reduces retained earnings, which is why net income and retained earnings are different numbers.</p></div>"));
    wrap.appendChild(key);
    scrollTop();
  });

  var newNums = h('<button type="button" class="link-btn">New problem</button>');
  newNums.addEventListener("click", function () { startTransactions(mode); });
  sb.appendChild(scoreLbl);
  sb.appendChild(checkBtn);
  wrap.appendChild(sb);
  var nav = h('<div class="nav-row"></div>');
  nav.appendChild(newNums);
  wrap.appendChild(nav);
  render(wrap);
}


/* ---------- the three statement equations ---------- */
var EQ_OPTIONS = ["Assets", "Liabilities", "Equity", "Revenues", "Expenses", "Common stock", "Retained earnings", "Dividends", "Net income", "Cash"];

var EQ_ITEMS = [
  {
    name: "Balance sheet",
    slots: [
      { answer: "Assets" },
      { op: "=", answer: "Liabilities", pair: "bs" },
      { op: "+", answer: "Equity", pair: "bs" }
    ],
    e: "Everything the company owns had to be funded by somebody, either a creditor or an owner, so the two sides always equal. Liabilities are the nonowner claims on the assets and equity is the owner claim. Order does not matter across the plus sign."
  },
  {
    name: "Income statement",
    slots: [
      { answer: "Revenues" },
      { op: "\u2212", answer: "Expenses" }
    ],
    e: "Revenues minus expenses gives net income, or a net loss if expenses are larger. Order matters here: subtraction only runs one direction, and dividends are never part of it because they are a distribution to owners, not an expense."
  },
  {
    name: "Statement of stockholders' equity",
    slots: [
      { answer: "Common stock" },
      { op: "+", answer: "Retained earnings", pair: "se" }
    ],
    e: "Equity has exactly two pieces: common stock, the contributed capital owners paid in, and retained earnings, the earned capital the company generated itself. Retained earnings is where dividends land, which is why a dividend shows up on this statement and never on the income statement."
  }
];

function startEquations(mode) {
  var items = shuffle(EQ_ITEMS);
  var wrap = document.createElement("div");

  var bar = h('<div class="topbar"></div>');
  bar.appendChild(homeLink());
  bar.appendChild(h('<div class="topbar-label">7 blanks</div>'));
  wrap.appendChild(bar);
  wrap.appendChild(h('<div class="intro-card"><p class="intro-kicker">The three equations</p>' +
    '<p class="intro-text">Fill in each statement\'s equation. Where two terms are added together, either order counts. ' +
    "These three sit under every problem on the exam, so it is worth being able to write them from memory.</p></div>"));

  var card = h('<div class="exam-card"></div>');
  var blocks = [];
  items.forEach(function (item) {
    var block = h('<div class="eq-block"></div>');
    // the balance sheet line reads "Assets = ..." so its first slot needs no operator
    block.appendChild(h('<p class="eq-name">' + escapeHtml(item.name) + "</p>"));
    var row = h('<div class="eq-row"></div>');
    var sels = [];
    item.slots.forEach(function (slot) {
      if (slot.op) row.appendChild(h('<span class="eq-op">' + slot.op + "</span>"));
      var sel = document.createElement("select");
      sel.className = "eq-select";
      sel.innerHTML = '<option value="">Select</option>' + shuffle(EQ_OPTIONS).map(function (o) {
        return '<option value="' + escapeHtml(o) + '">' + escapeHtml(o) + "</option>";
      }).join("");
      row.appendChild(sel);
      sels.push({ sel: sel, slot: slot });
    });
    block.appendChild(row);
    var note = h('<p class="row-note" hidden style="margin-top:11px"></p>');
    block.appendChild(note);
    card.appendChild(block);
    blocks.push({ item: item, sels: sels, note: note });
  });
  wrap.appendChild(card);

  var sb = h('<div class="start-bar" style="margin-top:26px"></div>');
  var scoreLbl = h('<div class="topbar-label"></div>');
  var checkBtn = h('<button type="button" class="stamp-btn"><span>Check answers</span></button>');
  checkBtn.addEventListener("click", function () {
    var right = 0, total = 0;
    blocks.forEach(function (b) {
      // terms joined by a plus sign are interchangeable, so grade those as a set
      var pairAnswers = b.sels.filter(function (s) { return s.slot.pair; }).map(function (s) { return s.slot.answer; });
      var claimed = [];
      var allRight = true;
      b.sels.forEach(function (s) {
        total++;
        var ok;
        if (s.slot.pair) {
          var idx = pairAnswers.indexOf(s.sel.value);
          ok = idx !== -1 && claimed.indexOf(idx) === -1;
          if (ok) claimed.push(idx);
        } else {
          ok = s.sel.value === s.slot.answer;
        }
        s.sel.classList.remove("right", "wrong");
        s.sel.classList.add(ok ? "right" : "wrong");
        if (ok) right++; else allRight = false;
      });
      b.note.hidden = false;
      b.note.className = "row-note" + (allRight ? "" : " wrong");
      var correct = b.item.slots.map(function (s, i) { return (i === 0 ? "" : s.op + " ") + s.answer; }).join(" ");
      b.note.textContent = (allRight ? "" : b.item.name + " = " + correct + ". ") + b.item.e;
    });
    scoreLbl.textContent = right + " of " + total + " correct";
  });
  var again = h('<button type="button" class="link-btn">Shuffle and retry</button>');
  again.addEventListener("click", function () { startEquations(mode); });
  sb.appendChild(scoreLbl);
  sb.appendChild(checkBtn);
  wrap.appendChild(sb);
  var nav = h('<div class="nav-row"></div>');
  nav.appendChild(again);
  wrap.appendChild(nav);
  render(wrap);
}

showHome();
})();
</script>

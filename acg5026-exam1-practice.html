/* ---------- statement of cash flows builder ---------- */
var CF_ROWS = [
  { t: "in", key: "ops", label: "Net cash flows from operations", alias: ["net cash flows from operations", "net cash flow from operations", "cash flows from operations", "cash flow from operations", "net cash from operations", "cash from operations", "operating activities", "net cash flows from operating activities", "operations"] },
  { t: "in", key: "inv", label: "Net cash flows from investing", alias: ["net cash flows from investing", "net cash flow from investing", "cash flows from investing", "cash flow from investing", "net cash from investing", "cash from investing", "investing activities", "net cash flows from investing activities", "investing"] },
  { t: "in", key: "fin", label: "Net cash flows from financing", alias: ["net cash flows from financing", "net cash flow from financing", "cash flows from financing", "cash flow from financing", "net cash from financing", "cash from financing", "financing activities", "net cash flows from financing activities", "financing"] },
  { t: "in", key: "fx", label: "Effect of exchange rates on cash", alias: ["effect of exchange rates on cash", "effect of exchange rates", "effect of exchange rate changes on cash", "exchange rate effect", "effect of foreign exchange rates on cash", "foreign exchange effect", "exchange rates"] },
  { t: "calc", calc: "change", text: "Net change in cash", cls: "total" },
  { t: "in", key: "begin", label: "Cash, beginning year", alias: ["cash beginning year", "cash beginning of year", "cash at beginning of year", "beginning cash", "cash beginning", "beginning cash balance"] },
  { t: "calc", calc: "end", text: "Cash, ending year", cls: "grand" }
];

var CF_LABEL_POOL = [
  "Net cash flows from operations", "Net cash flows from investing", "Net cash flows from financing",
  "Effect of exchange rates on cash", "Cash, beginning year", "Net change in cash", "Cash, ending year",
  "Net income", "Gross profit", "Retained earnings", "Total assets", "Accounts payable"
];

function makeCashFlow() {
  var ops, inv, fin, fx, begin, change, end, tries = 0;
  do {
    ops = Math.random() < 0.9 ? rnd(600, 9000, 1) : -rnd(200, 1500, 1);
    inv = -rnd(200, 6500, 1);
    fin = Math.random() < 0.75 ? -rnd(150, 4500, 1) : rnd(150, 3500, 1);
    fx = Math.random() < 0.5 ? -rnd(5, 320, 1) : rnd(5, 320, 1);
    begin = rnd(250, 7000, 1);
    change = ops + inv + fin + fx;
    end = begin + change;
    tries++;
  } while ((end < 60 || Math.abs(change) < 40) && tries < 600);

  return {
    company: pick(BANK.companies),
    date: pick(BANK.dates),
    facts: shuffle([
      ["Net cash flows from operations", ops],
      ["Net cash flows from investing", inv],
      ["Net cash flows from financing", fin],
      ["Effect of exchange rates on cash", fx],
      ["Cash, beginning year", begin]
    ]),
    keys: { ops: ops, inv: inv, fin: fin, fx: fx, begin: begin, change: change, end: end }
  };
}

function startCashFlow(mode) {
  var isDrop = mode.variant === "dropdown";
  var prob = makeCashFlow();
  var wrap = document.createElement("div");

    if (any(["ops", "inv", "fin", "fx", "begin"])) {
      note.hidden = false;

        ? "Cash went up by " + fmt(change) + " over the year, ending at " + fmt(end) + "."
        : "Cash went down by " + fmt(Math.abs(change)) + " over the year, ending at " + fmt(end) + ".";

  var sb = h('<div class="start-bar" style="margin-top:26px"></div>');

  checkBtn.addEventListener("click", function () {

    CF_ROWS.filter(function (r) { return r.t === "in"; }).forEach(function (r) {
      total += 2;
      var lf = lblFields[r.key], af = amtFields[r.key];
      var lblOk = isDrop ? (lf.value === r.label) : matchText(lf.value, r.alias);
      lf.classList.remove("right", "wrong");
      lf.classList.add(lblOk ? "right" : "wrong");
      if (lblOk) right++;
      var amtOk = parseAmt(af.value) === prob.keys[r.key];
      af.classList.remove("right", "wrong");
      af.classList.add(amtOk ? "right" : "wrong");
      if (amtOk) right++;
    });
    scoreLbl.textContent = right + " of " + total + " boxes correct";
    var existing = wrap.querySelector(".review");
    if (existing) existing.remove();
    var k = prob.keys;
    var key = h('<div class="review" style="margin-top:26px"></div>');
    key.appendChild(h('<h3 class="review-heading">Answer key</h3>'));
    key.appendChild(h('<div class="review-item">' +
      '<p class="review-correct">Operations ' + fmt(k.ops) + ", investing " + fmt(k.inv) + ", financing " + fmt(k.fin) + ", exchange rate effect " + fmt(k.fx) + "</p>" +
      '<p class="review-correct">Net change in cash: ' + fmt(k.change) + "</p>" +
      '<p class="review-correct">Cash, beginning year ' + fmt(k.begin) + " plus the net change equals cash, ending year " + fmt(k.end) + "</p>" +
      '<p class="review-explain">The three activity sections are the same three business activities from Chapter 1, and added together with the exchange rate effect they explain every dollar of movement in the cash balance. ' +
      "Investing is usually negative for a company that is buying assets, and financing is negative when a company is paying down debt or paying dividends. " +
      "Ending cash is not a free-standing number: it has to equal the cash line on that year's balance sheet.</p></div>"));
    wrap.appendChild(key);

  { type: "Liabilities", inc: "Credit", dec: "Debit",
    e: "Liabilities sit on the other side of the accounting equation from assets, so they work the opposite way. Borrowing money credits the liability; paying it off debits it." },
  { type: "Equity", inc: "Credit", dec: "Debit",
    e: "Equity has a normal credit balance, same as liabilities, because both are claims on assets. Issuing stock credits equity; a dividend debits retained earnings." },
  { type: "Revenues", inc: "Credit", dec: "Debit",
    e: "Revenues increase equity, so they follow the equity rule: a credit increases revenue. This is why a sale credits Sales Revenue and debits Cash or Accounts Receivable." },

  render(wrap);
}


/* ---------- journal entry practice ---------- */
var JE_ACCOUNTS = {
  cash: { label: "Cash", alias: ["cash"] },
  cs: { label: "Common stock", alias: ["common stock", "stock", "capital stock"] },
  inv: { label: "Inventory", alias: ["inventory", "inventories", "merchandise inventory"] },
  ap: { label: "Accounts payable", alias: ["accounts payable", "ap", "payables", "accounts payables"] },
  ar: { label: "Accounts receivable", alias: ["accounts receivable", "ar", "receivables", "accounts receivables"] },
  sales: { label: "Sales", alias: ["sales", "sales revenue", "revenue", "revenues"] },
  cogs: { label: "Cost of goods sold", alias: ["cost of goods sold", "cogs", "cost of sales"] },
  equip: { label: "Equipment", alias: ["equipment"] },
  np: { label: "Notes payable", alias: ["notes payable", "note payable", "notes payables"] },
  wages: { label: "Wages expense", alias: ["wages expense", "wage expense", "wages", "salaries expense"] },
  re: { label: "Retained earnings", alias: ["retained earnings"] }
};

var JE_DISTRACTORS = ["Dividends", "Unearned revenue", "Prepaid insurance", "Interest expense", "Land", "Accrued liabilities", "Additional paid-in capital", "Supplies"];

function makeJournal() {
  var stock, inv, sale, equip, wages, div, endCash, tries = 0;
  do {
    stock = rnd(8, 30, 1) * 5000;
    inv = rnd(6, 40, 1) * 500;
    sale = Math.round(inv * (rnd(130, 195, 1) / 100) / 500) * 500;
    equip = rnd(8, 40, 1) * 1000;
    wages = rnd(3, 18, 1) * 500;
    div = rnd(2, 20, 1) * 500;
    endCash = stock + sale - wages - equip - div;
    tries++;
  } while ((sale <= inv || endCash < 5000) && tries < 500);

  var A = JE_ACCOUNTS;
  var entries = [
    { text: "Receive $" + fmt(stock) + " cash in exchange for common stock.", dr: A.cash, cr: A.cs, amt: stock, memo: "To record stock issuance." },
    { text: "Purchase $" + fmt(inv) + " of inventory on credit.", dr: A.inv, cr: A.ap, amt: inv, memo: "To record purchase of inventory." },
    { text: "Sell inventory for $" + fmt(sale) + " on credit.", dr: A.ar, cr: A.sales, amt: sale, memo: "To record sale of inventory." },
    { text: "Record $" + fmt(inv) + " for cost of inventory sold in transaction 3.", dr: A.cogs, cr: A.inv, amt: inv, memo: "To record cost of inventory sold." },
    { text: "Collect $" + fmt(sale) + " cash from transaction 3.", dr: A.cash, cr: A.ar, amt: sale, memo: "To record cash collection." },
    { text: "Acquire $" + fmt(equip) + " of equipment by signing a note.", dr: A.equip, cr: A.np, amt: equip, memo: "To record acquisition of equipment." },
    { text: "Pay wages of $" + fmt(wages) + " in cash.", dr: A.wages, cr: A.cash, amt: wages, memo: "To record wage payment." },
    { text: "Pay $" + fmt(equip) + " on a note payable that came due.", dr: A.np, cr: A.cash, amt: equip, memo: "To record payment of note payable." },
    { text: "Pay $" + fmt(div) + " cash dividend.", dr: A.re, cr: A.cash, amt: div, memo: "To record payment of cash dividend." }
  ];
  return {
    company: pick(BANK.companies),
    entries: entries,
    totals: entries.reduce(function (t, e) { return t + e.amt; }, 0),
    nums: { stock: stock, inv: inv, sale: sale, equip: equip, wages: wages, div: div, endCash: endCash }
  };
}

function startJournal(mode) {
  var isDrop = mode.variant === "dropdown";
  var prob = makeJournal();
  var wrap = document.createElement("div");

  var bar = h('<div class="topbar"></div>');
  bar.appendChild(homeLink());
  bar.appendChild(h('<div class="topbar-label">9 entries</div>'));
  wrap.appendChild(bar);

  var txns = prob.entries.map(function (e, i) { return "<li>" + escapeHtml(e.text) + "</li>"; }).join("");
  wrap.appendChild(h('<div class="stmt-prompt"><h3>' + escapeHtml(prob.company) + "</h3>" +
    '<p class="ask" style="margin-top:0;margin-bottom:11px">Record each transaction in the general journal below.</p>' +
    '<ol class="txn-list">' + txns + "</ol>" +
    '<p class="ask">Debit line first, credit line indented underneath' + (isDrop ? " (pick each account from the dropdown)" : " (type each account name yourself)") +
    ". Put each amount in the correct column and leave the other column blank. Total debits and total credits at the bottom update as you type.</p></div>"));

  var card = h('<div class="exam-card" style="padding-top:18px"></div>');
  var table = h('<table class="je-table"><thead><tr><th>Ref</th><th>Description</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody></tbody></table>');
  var tbody = table.querySelector("tbody");
  var lines = [];

  function acctField() {
    if (isDrop) {
      var sel = document.createElement("select");
      sel.className = "je-acct-field";
      var pool = [];
      Object.keys(JE_ACCOUNTS).forEach(function (k) { pool.push(JE_ACCOUNTS[k].label); });
      pool = pool.concat(JE_DISTRACTORS);
      sel.innerHTML = '<option value="">Select account</option>' + shuffle(pool).map(function (o) {
        return '<option value="' + escapeHtml(o) + '">' + escapeHtml(o) + "</option>";
      }).join("");
      return sel;
    }
    var inp = document.createElement("input");
    inp.type = "text";
    inp.className = "je-acct-field";
    inp.placeholder = "Account name";
    inp.autocomplete = "off";
    inp.spellcheck = false;
    return inp;
  }
  function amtField() {
    var inp = document.createElement("input");
    inp.type = "text";
    inp.className = "je-input";
    inp.autocomplete = "off";
    inp.addEventListener("input", recalc);
    return inp;
  }

  prob.entries.forEach(function (e, i) {
    ["dr", "cr"].forEach(function (side) {
      var tr = document.createElement("tr");
      if (side === "cr") tr.className = "cr-line";
      var tdRef = document.createElement("td");
      tdRef.className = "je-ref";
      if (side === "dr") tdRef.textContent = "(" + (i + 1) + ")";
      var tdAcct = document.createElement("td");
      tdAcct.className = "je-acct";
      var af = acctField();
      tdAcct.appendChild(af);
      var tdDr = document.createElement("td");
      tdDr.className = "je-num";
      var dIn = amtField();
      tdDr.appendChild(dIn);
      var tdCr = document.createElement("td");
      tdCr.className = "je-num";
      var cIn = amtField();
      tdCr.appendChild(cIn);
      tr.appendChild(tdRef); tr.appendChild(tdAcct); tr.appendChild(tdDr); tr.appendChild(tdCr);
      tbody.appendChild(tr);
      lines.push({ entry: e, side: side, acct: af, dr: dIn, cr: cIn });
    });
    var memoTr = document.createElement("tr");
    memoTr.className = "memo-row";
    var pad = document.createElement("td");
    var memoTd = document.createElement("td");
    memoTd.colSpan = 3;
    memoTd.innerHTML = '<span class="je-memo">' + escapeHtml(e.memo) + "</span>";
    memoTr.appendChild(pad); memoTr.appendChild(memoTd);
    tbody.appendChild(memoTr);
  });
  card.appendChild(table);
  var totals = h('<div class="je-totals"><div>Total debits <span id="td-val">0</span></div><div>Total credits <span id="tc-val">0</span></div></div>');
  card.appendChild(totals);
  var tieNote = h('<p class="tie-note" hidden></p>');
  card.appendChild(tieNote);
  wrap.appendChild(card);

  function num(inp) { var v = parseAmt(inp.value); return isNaN(v) ? 0 : v; }
  function recalc() {
    var td = 0, tc = 0, any = false;
    lines.forEach(function (l) {
      td += num(l.dr); tc += num(l.cr);
      if (l.dr.value.trim() !== "" || l.cr.value.trim() !== "") any = true;
    });
    totals.querySelector("#td-val").textContent = fmt(td);
    totals.querySelector("#tc-val").textContent = fmt(tc);
    if (!any) { tieNote.hidden = true; return; }
    tieNote.hidden = false;
    if (td === tc) {
      tieNote.className = "tie-note ok";
      tieNote.textContent = "Debits equal credits at " + fmt(td) + ". That has to be true in every journal entry and in the journal as a whole.";
    } else {
      tieNote.className = "tie-note bad";
      tieNote.textContent = "Debits and credits do not agree: " + fmt(td) + " versus " + fmt(tc) + ", off by " + fmt(Math.abs(td - tc)) + ".";
    }
  }

  var sb = h('<div class="start-bar" style="margin-top:26px"></div>');
  var scoreLbl = h('<div class="topbar-label"></div>');
  var checkBtn = h('<button type="button" class="stamp-btn"><span>Check my work</span></button>');
  checkBtn.addEventListener("click", function () {
    var right = 0, total = 0;
    lines.forEach(function (l) {
      var target = l.side === "dr" ? l.entry.dr : l.entry.cr;
      total += 2;
      var acctOk = isDrop ? (l.acct.value === target.label) : matchText(l.acct.value, target.alias);
      l.acct.classList.remove("right", "wrong");
      l.acct.classList.add(acctOk ? "right" : "wrong");
      if (acctOk) right++;
      // the amount has to be in the correct column, with the other column left empty
      var filled = l.side === "dr" ? l.dr : l.cr;
      var empty = l.side === "dr" ? l.cr : l.dr;
      var emptyOk = empty.value.trim() === "" || parseAmt(empty.value) === 0;
      var amtOk = parseAmt(filled.value) === l.entry.amt && emptyOk;
      [l.dr, l.cr].forEach(function (f) { f.classList.remove("right", "wrong"); f.classList.add(amtOk ? "right" : "wrong"); });
      if (amtOk) right++;
    });
    scoreLbl.textContent = right + " of " + total + " boxes correct";

    var existing = wrap.querySelector(".review");
    if (existing) existing.remove();
    var key = h('<div class="review" style="margin-top:26px"></div>');
    key.appendChild(h('<h3 class="review-heading">Answer key</h3>'));
    var rowsHtml = prob.entries.map(function (e, i) {
      return '<p class="review-correct">(' + (i + 1) + ") Dr " + escapeHtml(e.dr.label) + " " + fmt(e.amt) + ", Cr " + escapeHtml(e.cr.label) + " " + fmt(e.amt) + "</p>";
    }).join("");
    key.appendChild(h('<div class="review-item">' + rowsHtml +
      '<p class="review-explain">Three things to watch on this problem. Entry 4 uses the same amount as entry 2 because all of the inventory purchased was sold, and entry 8 repays exactly what the note in entry 6 created, so those amounts are never independent. ' +
      "The dividend in entry 9 debits Retained earnings, not a Dividends account, because that is how your slides record it, and a dividend is a distribution to owners rather than an expense. " +
      "Debits total " + fmt(prob.totals) + " and credits total the same, which is the fastest check that you have not flipped a column somewhere.</p></div>"));
    wrap.appendChild(key);
    scrollTop();
  });
  var newNums = h('<button type="button" class="link-btn">New numbers</button>');
  newNums.addEventListener("click", function () { startJournal(mode); });
  sb.appendChild(scoreLbl);
  sb.appendChild(checkBtn);
  wrap.appendChild(sb);
  var nav = h('<div class="nav-row"></div>');
  nav.appendChild(newNums);
  wrap.appendChild(nav);
  render(wrap);
}


/* ---------- transactions to financial statements ---------- */
var TX_STUDIOS = ["Paulson Photography", "Kestrel Photography", "Marin Studio", "Brightline Studios", "Copperfield Photo", "Larkin Photography"];

var TX_ACCTS = {
  rev: { label: "Service revenue", alias: ["service revenue", "service revenues", "revenue", "revenues", "sales", "sales revenue", "fees earned", "service fees earned", "photo services revenue"] },
  rent: { label: "Rent expense", alias: ["rent expense", "rent", "rental expense", "equipment rent expense"] },
  misc: { label: "Miscellaneous expense", alias: ["miscellaneous expense", "miscellaneous expenses", "misc expense", "misc expenses", "miscellaneous"] },
  loss: { label: "Loss on sale of land", alias: ["loss on sale of land", "loss on land sale", "loss on sale", "loss"] },
  cash: { label: "Cash", alias: ["cash"] },
  ar: { label: "Accounts receivable", alias: ["accounts receivable", "receivables", "ar", "accounts receivables"] },
  land: { label: "Land", alias: ["land"] },
  np: { label: "Notes payable", alias: ["notes payable", "note payable", "bank loan", "loan payable", "notes payables"] },
  cs: { label: "Common stock", alias: ["common stock", "stock", "capital stock"] },
  re: { label: "Retained earnings", alias: ["retained earnings"] }
};

var TX_DISTRACTORS = ["Dividends", "Equipment", "Prepaid rent", "Accounts payable", "Inventory", "Cost of goods sold", "Gain on sale of land", "Wages expense", "Unearned revenue"];

function makeTransactions() {
  var cs, np, land, rent, svcCash, svcAr, misc, parcelCost, parcelPrice, loss, div;
  var rev, ni, re, cash, landLeft, ta, tries = 0;
  do {
    cs = rnd(8, 30, 1) * 1000;
    np = rnd(4, 24, 1) * 500;
    land = rnd(6, 20, 1) * 1000;
    rent = rnd(4, 16, 1) * 500;
    svcCash = rnd(8, 30, 1) * 1000;
    svcAr = rnd(2, 12, 1) * 500;
    misc = rnd(4, 16, 1) * 500;
    parcelCost = Math.round(land * (rnd(25, 50, 1) / 100) / 500) * 500;
    loss = rnd(1, 8, 1) * 100;
    parcelPrice = parcelCost - loss;
    div = rnd(2, 16, 1) * 500;
    rev = svcCash + svcAr;
    ni = rev - rent - misc - loss;
    re = ni - div;
    cash = cs + np - land - rent + svcCash - misc + parcelPrice - div;
    landLeft = land - parcelCost;
    ta = cash + svcAr + landLeft;
    tries++;
  } while ((cash < 1500 || ni < 1200 || re < 500 || parcelCost < 1000 || landLeft < 1500) && tries < 900);

  var A = TX_ACCTS;
  return {
    company: pick(TX_STUDIOS),
    date: pick(BANK.dates),
    txns: [
      "Collected $" + fmt(cs) + " in cash from shareholders.",
      "Borrowed $" + fmt(np) + " from a bank.",
      "Purchased two parcels of land for a total of $" + fmt(land) + ".",
      "Paid $" + fmt(rent) + " cash to rent camera equipment for the remainder of the year.",
      "Sold photo services to customers, receiving $" + fmt(svcCash) + " in cash and $" + fmt(svcAr) + " in receivables.",
      "Paid miscellaneous expenses of $" + fmt(misc) + ".",
      "Sold one parcel of land with a cost of $" + fmt(parcelCost) + " for $" + fmt(parcelPrice) + ".",
      "Paid a $" + fmt(div) + " dividend to shareholders."
    ],
    keys: {
      rev: { a: A.rev, v: rev }, rent: { a: A.rent, v: rent }, misc: { a: A.misc, v: misc }, loss: { a: A.loss, v: loss },
      cash: { a: A.cash, v: cash }, ar: { a: A.ar, v: svcAr }, land: { a: A.land, v: landLeft },
      np: { a: A.np, v: np }, cs: { a: A.cs, v: cs }, re: { a: A.re, v: re }
    },
    n: { cs: cs, np: np, land: land, rent: rent, svcCash: svcCash, svcAr: svcAr, misc: misc,
         parcelCost: parcelCost, parcelPrice: parcelPrice, loss: loss, div: div,
         rev: rev, ni: ni, re: re, cash: cash, landLeft: landLeft, ta: ta }
  };
}

function startTransactions(mode) {
  var isDrop = mode.variant === "dropdown";
  var prob = makeTransactions();
  var K = prob.keys;
  var wrap = document.createElement("div");

  var bar = h('<div class="topbar"></div>');
  bar.appendChild(homeLink());
  bar.appendChild(h('<div class="topbar-label">' + (isDrop ? "Dropdown account names" : "Everything blank") + "</div>"));
  wrap.appendChild(bar);

  wrap.appendChild(h('<div class="stmt-prompt"><h3>' + escapeHtml(prob.company) + "</h3>" +
    '<p class="ask" style="margin-top:0;margin-bottom:11px">Entered into the following transactions during the first year of its operations:</p>' +
    '<ol class="txn-list">' + prob.txns.map(function (t) { return "<li>" + escapeHtml(t) + "</li>"; }).join("") + "</ol>" +
    '<p class="ask">Prepare the income statement and the year-end balance sheet. Do the income statement first: retained earnings on the balance sheet needs net income, and this is the company\'s first year, so retained earnings starts at zero.</p></div>'));

  var groups = {
    rev: [K.rev], exp: [K.rent, K.misc, K.loss],
    asset: [K.cash, K.ar, K.land], liab: [K.np], eq: [K.cs, K.re]
  };
  var amtFields = {}, lblFields = {}, calcCells = {}, rowGroup = {};

  var labelPool = [];
  Object.keys(TX_ACCTS).forEach(function (k) { labelPool.push(TX_ACCTS[k].label); });
  labelPool = labelPool.concat(TX_DISTRACTORS);

  function buildTable(rows) {
    var table = h('<table class="stmt-table"><tbody></tbody></table>');
    var tbody = table.querySelector("tbody");
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      var cls = [];
      if (r.indent) cls.push("indent");
      if (r.cls) cls.push(r.cls);
      var tdL = document.createElement("td");
      tdL.className = "lbl";
      var tdA = document.createElement("td");
      tdA.className = "amt";
      if (r.t === "head") {
        cls.push("head-row");
        tdL.textContent = r.text;
      } else if (r.t === "in") {
        if (isDrop) {
          var sel = document.createElement("select");
          sel.className = "lbl-select";
          sel.innerHTML = '<option value="">Select account</option>' + shuffle(labelPool).map(function (o) {
            return '<option value="' + escapeHtml(o) + '">' + escapeHtml(o) + "</option>";
          }).join("");
          tdL.appendChild(sel);
          lblFields[r.key] = sel;
        } else {
          var li = document.createElement("input");
          li.type = "text";
          li.className = "lbl-input";
          li.placeholder = "Account name";
          li.autocomplete = "off";
          li.spellcheck = false;
          tdL.appendChild(li);
          lblFields[r.key] = li;
        }
        var ai = document.createElement("input");
        ai.type = "text";
        ai.className = "amt-input";
        ai.placeholder = "0";
        ai.autocomplete = "off";
        ai.addEventListener("input", recalc);
        tdA.appendChild(ai);
        amtFields[r.key] = ai;
        rowGroup[r.key] = r.grp;
      } else {
        tdL.textContent = r.text;
        tdA.className = "amt calc-cell";
        tdA.textContent = "\u2014";
        calcCells[r.calc] = tdA;
      }
      tr.className = cls.join(" ");
      tr.appendChild(tdL);
      tr.appendChild(tdA);
      tbody.appendChild(tr);
    });
    return table;
  }

  var isCard = h('<div class="exam-card" style="padding-top:0;margin-bottom:26px"></div>');
  isCard.appendChild(h('<div class="stmt-head">' + escapeHtml(prob.company) + "<span>Income Statement</span><span>For the Year Ended " + escapeHtml(prob.date) + "</span></div>"));
  isCard.appendChild(buildTable([
    { t: "in", key: "rev", grp: "rev" },
    { t: "in", key: "e1", grp: "exp" },
    { t: "in", key: "e2", grp: "exp" },
    { t: "in", key: "e3", grp: "exp" },
    { t: "calc", calc: "ni", text: "Net income", cls: "grand" }
  ]));
  var niNote = h('<p class="tie-note" hidden></p>');
  isCard.appendChild(niNote);
  wrap.appendChild(isCard);

  var bsCard = h('<div class="exam-card" style="padding-top:0"></div>');
  bsCard.appendChild(h('<div class="stmt-head">' + escapeHtml(prob.company) + "<span>Balance Sheet</span><span>" + escapeHtml(prob.date) + "</span></div>"));
  bsCard.appendChild(buildTable([
    { t: "head", text: "Assets" },
    { t: "in", key: "a1", grp: "asset", indent: true },
    { t: "in", key: "a2", grp: "asset", indent: true },
    { t: "in", key: "a3", grp: "asset", indent: true },
    { t: "calc", calc: "ta", text: "Total assets", cls: "grand" },
    { t: "head", text: "Liabilities and stockholders' equity" },
    { t: "in", key: "l1", grp: "liab", indent: true },
    { t: "in", key: "q1", grp: "eq", indent: true },
    { t: "in", key: "q2", grp: "eq", indent: true },
    { t: "calc", calc: "tle", text: "Total liabilities and stockholders' equity", cls: "grand" }
  ]));
  var tieNote = h('<p class="tie-note" hidden></p>');
  bsCard.appendChild(tieNote);
  wrap.appendChild(bsCard);

  function val(k) { var v = parseAmt(amtFields[k].value); return isNaN(v) ? 0 : v; }
  function filled(keys) { return keys.some(function (k) { return amtFields[k].value.trim() !== ""; }); }

  function recalc() {
    var ni = val("rev") - val("e1") - val("e2") - val("e3");
    var ta = val("a1") + val("a2") + val("a3");
    var tle = val("l1") + val("q1") + val("q2");
    calcCells.ni.textContent = filled(["rev", "e1", "e2", "e3"]) ? fmt(ni) : "\u2014";
    calcCells.ta.textContent = filled(["a1", "a2", "a3"]) ? fmt(ta) : "\u2014";
    calcCells.tle.textContent = filled(["l1", "q1", "q2"]) ? fmt(tle) : "\u2014";
    if (filled(["rev", "e1", "e2", "e3"])) {
      niNote.hidden = false;
      niNote.className = "tie-note " + (ni >= 0 ? "ok" : "bad");
      niNote.textContent = ni >= 0
        ? "Net income of " + fmt(ni) + ". Carry this into retained earnings below, less the dividend."
        : "That is a net loss of " + fmt(Math.abs(ni)) + ".";
    } else { niNote.hidden = true; }
    ["ta", "tle"].forEach(function (n) { calcCells[n].classList.remove("tie", "notie"); });
    if (filled(["a1", "a2", "a3"]) && filled(["l1", "q1", "q2"])) {
      var bal = ta === tle;
      ["ta", "tle"].forEach(function (n) { calcCells[n].classList.add(bal ? "tie" : "notie"); });
      tieNote.hidden = false;
      tieNote.className = "tie-note " + (bal ? "ok" : "bad");
      tieNote.textContent = bal
        ? "Balanced. Total assets equal total liabilities and stockholders' equity."
        : "Not balanced. Assets are " + fmt(ta) + " but liabilities plus equity come to " + fmt(tle) + ", off by " + fmt(Math.abs(ta - tle)) + ".";
    } else { tieNote.hidden = true; }
  }

  var sb = h('<div class="start-bar" style="margin-top:26px"></div>');
  var scoreLbl = h('<div class="topbar-label"></div>');
  var checkBtn = h('<button type="button" class="stamp-btn"><span>Check my work</span></button>');
  checkBtn.addEventListener("click", function () {
    var right = 0, total = 0;
    var claimed = {};
    Object.keys(groups).forEach(function (g) { claimed[g] = []; });
    Object.keys(amtFields).forEach(function (k) {
      var g = rowGroup[k], pool = groups[g];
      total += 2;
      var lf = lblFields[k], af = amtFields[k];
      var hit = null;
      for (var i = 0; i < pool.length; i++) {
        if (claimed[g].indexOf(i) !== -1) continue;
        var ok = isDrop ? (lf.value === pool[i].a.label) : matchText(lf.value, pool[i].a.alias);
        if (ok) { hit = i; break; }
      }
      var lblOk = hit !== null;
      if (lblOk) claimed[g].push(hit);
      lf.classList.remove("right", "wrong");
      lf.classList.add(lblOk ? "right" : "wrong");
      if (lblOk) right++;
      var amtOk = lblOk && parseAmt(af.value) === pool[hit].v;
      af.classList.remove("right", "wrong");
      af.classList.add(amtOk ? "right" : "wrong");
      if (amtOk) right++;
    });
    scoreLbl.textContent = right + " of " + total + " boxes correct";

    var n = prob.n;
    var existing = wrap.querySelector(".review");
    if (existing) existing.remove();
    var key = h('<div class="review" style="margin-top:26px"></div>');
    key.appendChild(h('<h3 class="review-heading">Answer key</h3>'));
    key.appendChild(h('<div class="review-item">' +
      '<p class="review-correct">Income statement: service revenue ' + fmt(n.rev) + " (cash " + fmt(n.svcCash) + " plus receivables " + fmt(n.svcAr) +
      "), rent expense " + fmt(n.rent) + ", miscellaneous expense " + fmt(n.misc) + ", loss on sale of land " + fmt(n.loss) + ", net income " + fmt(n.ni) + "</p>" +
      '<p class="review-correct">Retained earnings: net income ' + fmt(n.ni) + " minus the dividend of " + fmt(n.div) + " equals " + fmt(n.re) + ", starting from zero in year one</p>" +
      '<p class="review-correct">Cash ' + fmt(n.cash) + " = " + fmt(n.cs) + " in + " + fmt(n.np) + " in - " + fmt(n.land) + " land - " + fmt(n.rent) +
      " rent + " + fmt(n.svcCash) + " services - " + fmt(n.misc) + " misc + " + fmt(n.parcelPrice) + " parcel sale - " + fmt(n.div) + " dividend</p>" +
      '<p class="review-correct">Balance sheet: cash ' + fmt(n.cash) + ", accounts receivable " + fmt(n.svcAr) + ", land " + fmt(n.landLeft) +
      ", total assets " + fmt(n.ta) + "; notes payable " + fmt(n.np) + ", common stock " + fmt(n.cs) + ", retained earnings " + fmt(n.re) + "</p>" +
      '<p class="review-explain">Four places this problem tries to catch you. The receivable is revenue the moment the service is delivered, so revenue is ' + fmt(n.rev) +
      " even though only " + fmt(n.svcCash) + " came in as cash. Renting the camera equipment for the remainder of the year means it is fully used up, so it is rent expense, not equipment and not prepaid rent. " +
      "Land drops to " + fmt(n.landLeft) + " because one parcel costing " + fmt(n.parcelCost) + " is gone, and selling it for " + fmt(n.parcelPrice) +
      " creates a loss of " + fmt(n.loss) + " on the income statement rather than revenue. " +
      "And the dividend of " + fmt(n.div) + " never touches the income statement: it reduces retained earnings, which is why net income and retained earnings are different numbers.</p></div>"));
    wrap.appendChild(key);
    scrollTop();
  });
  var newNums = h('<button type="button" class="link-btn">New numbers</button>');
  newNums.addEventListener("click", function () { startTransactions(mode); });
  sb.appendChild(scoreLbl);
  sb.appendChild(checkBtn);
  wrap.appendChild(sb);
  var nav = h('<div class="nav-row"></div>');
  nav.appendChild(newNums);
  wrap.appendChild(nav);
  render(wrap);
}

showHome();
})();
</script>
</body>
</html>
